<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>どんぐりコマバトル</title>
<style>
  :root{
    --ink:#4a3421;
    --accent:#cf6f2a;
    --accent-dark:#a8561c;
    --panel:rgba(255,250,238,.96);
    --line:#d8c49a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; color:var(--ink); overflow:hidden; overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    background:#f3e5c8; touch-action:none;
  }
  #stage{ position:fixed; inset:0; }
  #stage canvas{ display:block; }
  .screen{ position:fixed; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- タイトル ---------- */
  #screen-title{ align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at center, rgba(255,246,225,0) 40%, rgba(84,50,16,.28) 100%); }
  #screen-title h1{ font-size:clamp(34px,9vw,54px); margin:0 0 28px; letter-spacing:.04em;
    color:#6e4520; text-shadow:0 2px 0 #fff3d6, 0 4px 14px rgba(110,69,32,.35); }
  .btn{
    font:inherit; font-weight:700; font-size:19px; color:#fff; background:var(--accent);
    border:none; border-radius:999px; padding:15px 40px; cursor:pointer;
    box-shadow:0 4px 0 var(--accent-dark), 0 8px 18px rgba(110,69,32,.3);
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--accent-dark); }
  .btn.sub{ background:#fffdf6; color:var(--ink); border:2px solid var(--accent);
    box-shadow:0 4px 0 #d8c49a; font-size:16px; padding:12px 26px; }
  #screen-title .btn.sub{ margin-top:14px; }

  /* ---------- 組み立て ---------- */
  #build-preview-space{ flex:1 1 auto; min-height:0; }
  #build-panel{
    background:var(--panel); border-radius:22px 22px 0 0;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(110,69,32,.18); max-height:54%; overflow-y:auto;
  }
  .group-label{ font-size:12px; font-weight:700; color:#9a7748; margin:10px 0 5px; letter-spacing:.08em; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    font:inherit; font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer;
    background:#fffdf6; color:var(--ink); border:2px solid var(--line);
  }
  .chip.sel{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .stats{ margin:12px 0 4px; display:grid; grid-template-columns:1fr 1fr; gap:5px 18px; }
  .stat{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .stat .slabel{ width:4.2em; color:#7a5a36; }
  .stat .pips{ font-size:13px; letter-spacing:3px; line-height:1; }
  .stat .pips .on{ color:var(--accent); }
  .stat .pips .off{ color:#e0cda1; }
  #build-panel .btn{ width:100%; margin-top:12px; }

  /* ---------- バトル ---------- */
  #hud{ padding:calc(10px + env(safe-area-inset-top)) 16px 0; display:flex; flex-direction:column; gap:6px;
    pointer-events:none; }
  .hud-row{ display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700;
    text-shadow:0 1px 0 rgba(255,250,238,.8); }
  .hud-row .hname{ width:3.4em; }
  .hud-row .bar{ flex:1; height:12px; background:rgba(255,253,246,.75); border:2px solid var(--line);
    border-radius:6px; overflow:hidden; }
  .hud-row .fill{ height:100%; width:100%; transition:width .12s linear; }
  #spin-player{ background:linear-gradient(90deg,#e8a34c,#cf6f2a); }
  #spin-cpu{ background:linear-gradient(90deg,#a9c46a,#7a9a4d); }
  #power-wrap{ margin-top:auto; padding:14px 18px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:12px; }
  #power-bar-wrap{ width:82%; max-width:340px; height:16px; background:rgba(255,253,246,.8);
    border:2px solid var(--line); border-radius:8px; overflow:hidden; }
  #power-fill{ height:100%; width:0%; background:linear-gradient(90deg,#e8a34c,#d23c1e); }
  #launch-btn{ touch-action:none; user-select:none; -webkit-user-select:none; }
  #launch-btn:disabled{ opacity:.45; box-shadow:none; }
  #launch-btn.boosting{ background:#d23c1e; box-shadow:0 4px 0 #8e2412, 0 8px 18px rgba(110,69,32,.3); }
  #launch-btn.boost-keep{ background:#e86a1e; box-shadow:0 4px 0 #a8561c, 0 8px 18px rgba(110,69,32,.3); }
  #battle-msg{ font-size:14px; font-weight:700; color:#6e4520; text-shadow:0 1px 0 rgba(255,250,238,.9);
    min-height:1.3em; }

  /* ---------- タイミング円 ---------- */
  #timing-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px;
    height:150px; justify-content:flex-end; }
  #timing-ring{ width:118px; height:118px; border-radius:50%; flex:none; position:relative;
    border:4px solid var(--accent);
    background:radial-gradient(circle, rgba(207,111,42,.20), rgba(207,111,42,.04) 70%);
    opacity:0; transition:opacity .2s; }
  #timing-ring::after{ content:''; position:absolute; left:50%; top:50%; width:10px; height:10px;
    border-radius:50%; background:var(--accent-dark); transform:translate(-50%,-50%); }
  #timing-ring.good{ border-color:#7a9a4d;
    background:radial-gradient(circle, rgba(122,154,77,.35), rgba(122,154,77,.08) 70%); }
  #timing-ring.draw{ border-color:#c9a227;
    background:radial-gradient(circle, rgba(201,162,39,.35), rgba(201,162,39,.08) 70%); }
  #timing-ring.bad{ border-color:#b0483a;
    background:radial-gradient(circle, rgba(176,72,58,.32), rgba(176,72,58,.07) 70%); }
  #clash-msg{ font-size:15px; font-weight:800; color:#6e4520; min-height:1.3em;
    text-shadow:0 1px 0 rgba(255,250,238,.9); }

  /* ---------- 結果 ---------- */
  #screen-result{ align-items:center; justify-content:center; background:rgba(74,45,18,.35); }
  #result-card{ background:var(--panel); border-radius:22px; padding:30px 34px; text-align:center;
    box-shadow:0 12px 32px rgba(60,35,10,.35); max-width:84vw; }
  #result-title{ font-size:38px; font-weight:800; margin:0 0 6px; color:#6e4520; }
  #result-reason{ margin:0 0 22px; font-size:14px; color:#7a5a36; }
  #result-card .btns{ display:flex; flex-direction:column; gap:12px; align-items:center; }
</style>
</head>
<body>
<div id="stage"></div>

<!-- タイトル -->
<div id="screen-title" class="screen active">
  <h1>どんぐり<br>コマバトル</h1>
  <button id="play-btn" class="btn">あそぶ</button>
  <button id="demo-btn" class="btn sub">デモ対戦</button>
</div>

<!-- 組み立て -->
<div id="screen-build" class="screen">
  <div id="build-preview-space"></div>
  <div id="build-panel">
    <div class="group-label">軸</div>
    <div class="chips" id="chips-axis"></div>
    <div class="group-label">本体</div>
    <div class="chips" id="chips-body"></div>
    <div class="group-label">オプション</div>
    <div class="chips" id="chips-option"></div>
    <div class="group-label">難易度</div>
    <div class="chips" id="chips-difficulty"></div>
    <div class="stats" id="stats"></div>
    <button id="battle-btn" class="btn">バトル開始</button>
  </div>
</div>

<!-- バトル -->
<div id="screen-battle" class="screen">
  <div id="hud">
    <div class="hud-row"><span class="hname" id="name-player">あなた</span><div class="bar"><div class="fill" id="spin-player"></div></div></div>
    <div class="hud-row"><span class="hname" id="name-cpu">CPU</span><div class="bar"><div class="fill" id="spin-cpu"></div></div></div>
  </div>
  <div id="power-wrap">
    <div id="timing-wrap"><div id="timing-ring"></div><div id="clash-msg"></div></div>
    <div id="battle-msg"></div>
    <div id="power-bar-wrap"><div id="power-fill"></div></div>
    <button id="launch-btn" class="btn">長押しでパワー</button>
    <button id="demo-exit-btn" class="btn sub" style="display:none">タイトルへ</button>
  </div>
</div>

<!-- 結果 -->
<div id="screen-result" class="screen">
  <div id="result-card">
    <p id="result-title">勝ち！</p>
    <p id="result-reason"></p>
    <div class="btns" id="result-btns">
      <button id="rematch-btn" class="btn">もう一度</button>
      <button id="rebuild-btn" class="btn sub">組み立てに戻る</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ================= パーツ定義 =================
   st: かいてん(spin) / こうげき(atk) / ぼうぎょ(def) / あんてい(stab) への寄与 */
const AXES = {
  normal: { name:'ふつう',   len:1.0,  r:0.050, mass:1.00, st:{ spin:3, atk:3, def:3, stab:3 } },
  long:   { name:'ロング',   len:1.5,  r:0.050, mass:1.00, st:{ spin:5, atk:2, def:3, stab:5 } },
  short:  { name:'ショート', len:0.62, r:0.050, mass:0.95, st:{ spin:1, atk:5, def:3, stab:2 } },
  fat:    { name:'ふと軸',   len:1.0,  r:0.105, mass:1.30, st:{ spin:3, atk:4, def:4, stab:3 } },
};
const BODIES = {
  maru: { name:'まる型', sx:1.00, sy:1.00, mass:1.00, st:{ spin:4, atk:4, def:4, stab:4 } },
  hoso: { name:'ほそ型', sx:0.82, sy:1.30, mass:0.80, st:{ spin:3, atk:6, def:2, stab:3 } },
  hira: { name:'ひら型', sx:1.16, sy:0.60, mass:1.10, st:{ spin:4, atk:2, def:6, stab:6 } },
};
const OPTIONS = {
  none:  { name:'なし',   mass:1.00, st:{ spin:0, atk:0, def:0, stab:0 } },
  toge:  { name:'トゲ',   mass:1.05, st:{ spin:0, atk:2, def:0, stab:0 }, spike:true },
  ring:  { name:'リング', mass:1.10, st:{ spin:1, atk:0, def:3, stab:1 } },
  omori: { name:'おもり', mass:1.35, st:{ spin:-1, atk:2, def:1, stab:0 } },
};
const STAT_KEYS = [
  ['spin','かいてん'], ['atk','こうげき'], ['def','ぼうぎょ'], ['stab','あんてい'],
];

function calcStats(sel){
  const a = AXES[sel.axis], b = BODIES[sel.body], o = OPTIONS[sel.option];
  const st = {};
  for (const [k] of STAT_KEYS){
    st[k] = Math.max(1, Math.min(12, a.st[k] + b.st[k] + o.st[k]));
  }
  return {
    st,
    mass: a.mass * b.mass * o.mass,
    radius: b.sx,                 // 基準半径1 × 本体の横スケール
    spike: !!o.spike,
  };
}

/* ================= コマの3Dモデル ================= */
const COL = {
  player: { nut:0xc07a35, cap:0x71461f },
  cpu:    { nut:0x8aa653, cap:0x5f7434 },
  shaft: 0xe8cf9f,
};

function latheFrom(pts, mat){
  const v = pts.map(p => new THREE.Vector2(p[0], p[1]));
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(v, 28), mat);
  mesh.castShadow = true;
  return mesh;
}

/* 原点＝軸の先端（下端）。spinGroup が回転し、root が位置と傾きを持つ */
function buildTopMesh(sel, side){
  const axis = AXES[sel.axis], body = BODIES[sel.body], opt = sel.option;
  const colors = COL[side];
  const root = new THREE.Group();
  const spinG = new THREE.Group();
  root.add(spinG);

  const nutMat  = new THREE.MeshStandardMaterial({ color:colors.nut, roughness:0.65 });
  const capMat  = new THREE.MeshStandardMaterial({ color:colors.cap, roughness:0.95 });
  const bodyH = 1.40 * body.sy;
  const below = 0.5 * axis.len;   // 本体より下に出る軸の長さ

  // 本体（どんぐり）: 実＋帽子＋へた
  const bodyG = new THREE.Group();
  bodyG.position.y = below;
  bodyG.scale.set(body.sx, body.sy, body.sx);
  const nut = latheFrom([
    [0.001,0.00],[0.30,0.02],[0.55,0.08],[0.78,0.22],[0.92,0.42],
    [0.99,0.62],[1.00,0.78],[0.94,0.92],[0.82,1.00],
  ], nutMat);
  const cap = latheFrom([
    [0.84,0.97],[0.97,1.03],[1.01,1.12],[0.95,1.22],[0.78,1.30],
    [0.52,1.36],[0.24,1.39],[0.001,1.40],
  ], capMat);
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.065, 0.24, 8), capMat);
  stem.position.set(0.03, 1.46, 0); stem.rotation.z = 0.18; stem.castShadow = true;
  bodyG.add(nut, cap, stem);

  // オプションパーツ（本体グループ内なので形に追随する）
  if (opt === 'toge'){
    const spikeMat = new THREE.MeshStandardMaterial({ color:0x6b6b6b, roughness:0.4, metalness:0.7 });
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < 6; i++){
      const th = (i / 6) * Math.PI * 2;
      const dir = new THREE.Vector3(Math.cos(th), 0, Math.sin(th));
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.34, 10), spikeMat);
      cone.position.set(dir.x * 1.05, 0.62, dir.z * 1.05);
      cone.quaternion.setFromUnitVectors(up, dir);
      cone.castShadow = true;
      bodyG.add(cone);
    }
  } else if (opt === 'ring'){
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.05, 0.075, 12, 36),
      new THREE.MeshStandardMaterial({ color:0xc9a227, roughness:0.35, metalness:0.8 }));
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.62; ring.castShadow = true;
    bodyG.add(ring);
  } else if (opt === 'omori'){
    const band = new THREE.Mesh(
      new THREE.CylinderGeometry(1.07, 1.07, 0.30, 28, 1, true),
      new THREE.MeshStandardMaterial({ color:0x5a4a3a, roughness:0.5, metalness:0.6, side:THREE.DoubleSide }));
    band.position.y = 0.42; band.castShadow = true;
    bodyG.add(band);
  }
  spinG.add(bodyG);

  // 軸（つまようじ）: 先端から本体を貫いて上へ
  const above = 0.30 * axis.len;
  const shaftLen = below + bodyH + above;
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(axis.r, axis.r * 0.8, shaftLen, 10),
    new THREE.MeshStandardMaterial({ color:COL.shaft, roughness:0.8 }));
  shaft.position.y = shaftLen / 2;
  shaft.castShadow = true;
  spinG.add(shaft);

  // 瀕死サイン用：本体（実と帽子）のマテリアルと元の色を覚えておく
  root.userData.blink = [
    { mat: nutMat, base: new THREE.Color(colors.nut) },
    { mat: capMat, base: new THREE.Color(colors.cap) },
  ];
  root.userData.spinG = spinG;
  return root;
}

function disposeTop(root){
  root.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  });
}

/* ================= レンダラーとシーン ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0xf7ead2, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

function addLights(scene, shadowRange){
  scene.add(new THREE.HemisphereLight(0xfff4dd, 0x9a7a4f, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 1.7);
  sun.position.set(5, 10, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -shadowRange; sun.shadow.camera.right = shadowRange;
  sun.shadow.camera.top = shadowRange;   sun.shadow.camera.bottom = -shadowRange;
  sun.shadow.camera.far = 30;
  scene.add(sun);
}

/* --- プレビュー用シーン --- */
const previewScene = new THREE.Scene();
previewScene.background = new THREE.Color(0xf7ead2);
addLights(previewScene, 4);
const previewCam = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
previewCam.position.set(0, 2.1, 5.2);
previewCam.lookAt(0, 1.0, 0);
{
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(3.4, 40),
    new THREE.MeshStandardMaterial({ color:0xe8d3a8, roughness:1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  previewScene.add(ground);
}

/* --- バトル用シーン --- */
const ARENA_R = 6;                       // 土俵の半径
const BOWL_DEPTH = 1.5;                  // すり鉢の深さ（中心→縁の高さ。傾斜強化で1.2→1.5）
const bowlY = r => BOWL_DEPTH * (r / ARENA_R) * (r / ARENA_R);  // すり鉢の高さ
const SLOPE_PULL = 3.0;                  // 斜面で中心へ引かれる力の係数（傾斜強化で2.4→3.0）
const LIP_R = 5.9;          // 縁のヘリの位置（中心からの距離）。常時ガードレールとして働き、コマは場外に出ない
/* --- 衝突タイミングの調整パラメータ --- */
const TAP_WINDOW = 0.12;    // 衝突の前後この秒数以内のタップを成功とみなす
const GAP_MAX = 8;          // タイミング円が最大サイズになるときの、ボディの縁同士の間隔
const REVIVE_SPIN = 15;     // 瀕死のコマがジャスト成功で復活したときに回復するスピン
/* --- 難易度ごとのCPUジャスト成功率（組み立て画面の選択で CPU_TAP_RATE を差し替える） --- */
const DIFFICULTY_RATES = { easy: 0.25, normal: 0.5, hard: 0.9 };
let CPU_TAP_RATE = DIFFICULTY_RATES.normal;  // CPUがタップ判定（ジャスト）に成功する確率
const DEMO_JUST_RATE = 0.5;  // デモ対戦で両コマのジャスト成否を決める確率（難易度は適用しない）
const CLASH_WIN_DMG = 1.6;  // タップの勝敗がついたとき、勝者が与えるダメージの倍率
const KB_PUSH = 2.4;        // タップで負けた側への追加ノックバックの強さ
const DRAW_KB_TAN = 0.4;    // 相殺ノックバックに混ぜる時計回り接線成分の割合（対ノックバック量）
const FAIL_KB_RATE = 0.15;  // 失敗回数1回ごとにノックバックが増える割合
const TENSION_PULL = 0.5;   // テンション1段階あたりの引き寄せ加速度（0.35→0.5に強化）
const TENSION_CAP = 8;      // テンション効果の上限段階
const OPENING_PULL = 1.5;   // 序盤ブースト：発射直後だけ働く追加の引き寄せ加速度（最大値）
const OPENING_TIME = 5.0;   // 序盤ブーストが線形に減衰して消えるまでの秒数（初接触でも終了）
/* --- 相殺エスカレーション（相殺を重ねるほど試合が加速する） --- */
const DRAW_KB_RATE = 0.25;  // 相殺1回ごとに相殺ノックバックが増える割合（×(1 + 0.25×相殺回数)）
const PACE_STEP = 0.10;     // 相殺1回ごとのペース倍率の上昇（+10%）
const PACE_CAP = 2.0;       // ペース倍率の上限
/* --- ブーストボタン（プレイヤー専用） --- */
const BOOST_MULT = 2.0;     // ブースト中の速度倍率
const BOOST_KEEP = 1.5;     // ボタンを離した後もブースト速度を維持する秒数
const BOOST_FADE = 1.0;     // その後、通常速度へ戻るまでにかける秒数
const BOOST_DMG = 2;        // ブースト中にジャストの勝敗がついたときのダメージ倍率
/* スタート方式：時計の文字盤の位置から、目標の時計位置へ真っ直ぐ発射する直進ダッシュ。
   プレイヤーは7時→11時（左側を上がる）、CPUは1時→5時（右側を下がる）で、
   直進＋すり鉢の傾斜＋周回力が合わさって時計回りの流れになる */
const PLAYER_START_HOUR = 7, PLAYER_TARGET_HOUR = 11;  // プレイヤーの発射位置→目標位置（時）
const CPU_START_HOUR = 1, CPU_TARGET_HOUR = 5;         // CPUの発射位置→目標位置（時）
const START_R = 5.0;        // 発射位置の中心からの距離（ヘリの内側の斜面上）
/* スピン自然減衰（/秒）。時間経過での体力減りを抑えるため全体を従来の0.7倍にした。
   変更前：max(1.4, 7.6 − かいてん×0.55) → 変更後：max(0.98, 5.32 − かいてん×0.385) */
const spinDecayPerSec = st => Math.max(0.98, 5.32 - st.spin * 0.385);
const battleScene = new THREE.Scene();
battleScene.background = new THREE.Color(0xf7ead2);
addLights(battleScene, 9);
const battleCam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
{
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color:0xefdcb2, roughness:1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.06;
  battleScene.add(ground);

  const bowl = latheFrom([
    [0.001,0.00],[1.0,0.04],[2.0,0.17],[3.0,0.38],[4.0,0.67],[5.0,1.04],[5.5,1.26],[6.0,1.50],[6.35,1.73],[6.6,1.40],
  ], new THREE.MeshStandardMaterial({ color:0xffffff, vertexColors:true, roughness:0.85, side:THREE.DoubleSide }));
  bowl.castShadow = false; bowl.receiveShadow = true;
  // 中心からの距離に応じた色の濃淡（中心は深く、縁にいくほど明るく）で窪みを表現
  {
    const pos = bowl.geometry.attributes.position;
    const cols = new Float32Array(pos.count * 3);
    const cIn = new THREE.Color(0x7c4f24), cMid = new THREE.Color(0xb98a52), cOut = new THREE.Color(0xe3b96e);
    const tmp = new THREE.Color();
    for (let i = 0; i < pos.count; i++){
      const r = Math.hypot(pos.getX(i), pos.getZ(i));
      const tt = Math.min(1, r / ARENA_R);
      if (tt < 0.5) tmp.copy(cIn).lerp(cMid, tt * 2);
      else tmp.copy(cMid).lerp(cOut, (tt - 0.5) * 2);
      cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
    }
    bowl.geometry.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  }
  battleScene.add(bowl);

  // 縁（リム）：太く・濃くして土俵の輪郭と立ち上がりを強調
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(6.35, 0.13, 12, 56),
    new THREE.MeshStandardMaterial({ color:0x6e4520, roughness:0.8 }));
  rim.rotation.x = Math.PI / 2; rim.position.y = 1.73;
  battleScene.add(rim);

  // 縁の内側の低いヘリ（唇状の盛り上がり）。リムより低く・細くして「ちょっとした」段差にする
  const lip = new THREE.Mesh(
    new THREE.TorusGeometry(LIP_R, 0.075, 10, 64),
    new THREE.MeshStandardMaterial({ color:0x8a5a2a, roughness:0.8 }));
  lip.rotation.x = Math.PI / 2; lip.position.y = bowlY(LIP_R) + 0.03;
  battleScene.add(lip);

  // 斜面に沿った同心円ライン（濃淡交互で、窪みの等高線として目で追えるように）
  const ringMats = [
    new THREE.MeshStandardMaterial({ color:0x7d5226, roughness:0.9 }),
    new THREE.MeshStandardMaterial({ color:0xe6c07a, roughness:0.9 }),
  ];
  [1.2, 2.2, 3.2, 4.2, 5.2].forEach((r, i) => {
    const line = new THREE.Mesh(new THREE.TorusGeometry(r, 0.028, 8, 64), ringMats[i % 2]);
    line.rotation.x = Math.PI / 2;
    line.position.y = bowlY(r) + 0.012;
    battleScene.add(line);
  });
}

/* ================= 衝突の演出 =================
   火花パーティクル／衝撃波リング／画面シェイク／ヒットストップ／WebAudioの打撃音 */
/* --- 火花パーティクル（プール管理、加算ブレンドで寿命とともに暗く消える） --- */
const SPARK_MAX = 420;
const sparkPos  = new Float32Array(SPARK_MAX * 3);
const sparkCol  = new Float32Array(SPARK_MAX * 3);
const sparkVel  = new Float32Array(SPARK_MAX * 3);
const sparkBase = new Float32Array(SPARK_MAX * 3);   // 元の色（フェード計算用）
const sparkLife = new Float32Array(SPARK_MAX);
const sparkMaxLife = new Float32Array(SPARK_MAX);
for (let i = 0; i < SPARK_MAX; i++) sparkPos[i * 3 + 1] = -999;
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));
const sparkPoints = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
  size: 0.15, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
sparkPoints.frustumCulled = false;
battleScene.add(sparkPoints);
let sparkCursor = 0;

function spawnSparks(x, y, z, count, speed, just){
  for (let n = 0; n < count; n++){
    const i = sparkCursor; sparkCursor = (sparkCursor + 1) % SPARK_MAX;
    const th = Math.random() * Math.PI * 2;
    const sp = speed * (0.35 + Math.random() * 0.85);
    sparkPos[i * 3] = x; sparkPos[i * 3 + 1] = y; sparkPos[i * 3 + 2] = z;
    sparkVel[i * 3]     = Math.cos(th) * sp;
    sparkVel[i * 3 + 1] = (0.25 + Math.random() * 0.9) * sp;   // 上向き成分を持たせる
    sparkVel[i * 3 + 2] = Math.sin(th) * sp;
    sparkMaxLife[i] = sparkLife[i] = 0.3 + Math.random() * 0.35;
    // ジャスト時は明るい金色、通常は橙色の火花
    const r = 1.0, g = just ? 0.88 : 0.62, b = just ? 0.45 : 0.18;
    sparkBase[i * 3] = r; sparkBase[i * 3 + 1] = g; sparkBase[i * 3 + 2] = b;
    sparkCol[i * 3] = r;  sparkCol[i * 3 + 1] = g;  sparkCol[i * 3 + 2] = b;
  }
}

function updateSparks(dt){
  for (let i = 0; i < SPARK_MAX; i++){
    if (sparkLife[i] <= 0) continue;
    sparkLife[i] -= dt;
    if (sparkLife[i] <= 0){
      sparkPos[i * 3 + 1] = -999;
      sparkCol[i * 3] = sparkCol[i * 3 + 1] = sparkCol[i * 3 + 2] = 0;
      continue;
    }
    sparkVel[i * 3 + 1] -= 7.5 * dt;   // 重力
    sparkPos[i * 3]     += sparkVel[i * 3] * dt;
    sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
    sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
    const k = sparkLife[i] / sparkMaxLife[i];
    sparkCol[i * 3]     = sparkBase[i * 3] * k;
    sparkCol[i * 3 + 1] = sparkBase[i * 3 + 1] * k;
    sparkCol[i * 3 + 2] = sparkBase[i * 3 + 2] * k;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.color.needsUpdate = true;
}

/* --- 衝撃波リング（土俵表面に沿って広がる波紋） --- */
const ringPool = [];
for (let i = 0; i < 6; i++){
  const m = new THREE.Mesh(
    new THREE.RingGeometry(0.86, 1.0, 48),
    new THREE.MeshBasicMaterial({ color: 0xffe2a0, transparent: true, opacity: 0,
      side: THREE.DoubleSide, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  battleScene.add(m);
  ringPool.push({ mesh: m, t: 0, dur: 0.4, maxR: 2, active: false });
}
function spawnRing(x, z, strength, just){
  const r = ringPool.find(r => !r.active) || ringPool[0];
  const d = Math.hypot(x, z);
  r.mesh.position.set(x, bowlY(Math.min(d, ARENA_R)) + 0.07, z);
  r.mesh.material.color.setHex(just ? 0xffd34d : 0xffe2a0);
  r.t = 0; r.active = true; r.mesh.visible = true;
  r.dur = 0.34 + strength * 0.16;
  r.maxR = 1.5 + strength * 2.3 + (just ? 0.9 : 0);
}
function updateRings(dt){
  for (const r of ringPool){
    if (!r.active) continue;
    r.t += dt;
    const k = r.t / r.dur;
    if (k >= 1){ r.active = false; r.mesh.visible = false; continue; }
    const s = 0.25 + (r.maxR - 0.25) * (1 - (1 - k) * (1 - k));  // 最初速く、広がりながら減速
    r.mesh.scale.set(s, s, s);
    r.mesh.material.opacity = 0.8 * (1 - k);
  }
}

/* --- 画面シェイクとヒットストップ --- */
let shakeAmp = 0, shakeT = 0, shakeDur = 0.2;
function addShake(amp, dur){
  if (shakeT <= 0 || amp >= shakeAmp) shakeAmp = amp;
  shakeT = shakeDur = Math.max(shakeT, dur);
}
let hitstop = 0;   // 残り秒（実時間）。この間バトルの時間経過をほぼ止める
function addHitstop(sec){ hitstop = Math.max(hitstop, sec); }

/* --- 効果音（WebAudioで合成。ユーザー操作を起点に開始する） --- */
let audioCtx = null, noiseBuf = null;
function ensureAudio(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.1), audioCtx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playHit(strength, just){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const vol = Math.min(0.9, 0.22 + strength * 0.55) * (just ? 1.15 : 1);
  // 芯の打撃音：サイン波が低く落ちる
  const osc = audioCtx.createOscillator(), og = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(just ? 300 : 190, t);
  osc.frequency.exponentialRampToValueAtTime(55, t + 0.1);
  og.gain.setValueAtTime(vol, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.14);
  // 金属的なアタック：バンドパスを通したノイズバースト
  const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = just ? 2800 : 1700; bp.Q.value = 0.7;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(vol * 0.8, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  src.connect(bp); bp.connect(ng); ng.connect(audioCtx.destination);
  src.start(t); src.stop(t + 0.09);
  if (just){
    // ジャスト時は明るい上音を重ねる
    const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(740, t);
    o2.frequency.exponentialRampToValueAtTime(1180, t + 0.08);
    g2.gain.setValueAtTime(vol * 0.35, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(t); o2.stop(t + 0.13);
  }
}

/* --- 衝突演出のまとめ役：接触点で一式を発火する --- */
function triggerClashFX(x, z, strength, just){
  const d = Math.hypot(x, z);
  const y = bowlY(Math.min(d, ARENA_R)) + 0.7;
  spawnSparks(x, y, z,
    Math.round((10 + strength * 26) * (just ? 1.7 : 1)),
    2.2 + strength * 3.8, just);
  spawnRing(x, z, strength, just);
  addShake(0.03 + strength * 0.15 + (just ? 0.09 : 0), 0.15 + strength * 0.09);
  playHit(strength, just);
}
function updateFX(dt){
  updateSparks(dt);
  updateRings(dt);
}

/* 時計の文字盤上の位置（h時方向・半径r）の座標。
   画面との対応：12時＝奥（-Z）、3時＝右（+X）、6時＝手前（+Z）、9時＝左（-X） */
function clockPos(h, r){
  const th = h * Math.PI / 6;
  return { x: Math.sin(th) * r, z: -Math.cos(th) * r };
}

function launchFighter(f, startHour, targetHour, powerVal){
  const s = clockPos(startHour, START_R);
  const t = clockPos(targetHour, START_R);
  f.x = s.x; f.z = s.z;
  // 初速は目標の時計位置（同じ半径の点）への直線方向。大きさは従来どおり
  // （プレイヤーは長押しパワー、CPUはランダム）で、わずかなブレだけ付ける
  let dx = t.x - s.x, dz = t.z - s.z;
  const dl = Math.hypot(dx, dz); dx /= dl; dz /= dl;
  const jitter = (Math.random() - 0.5) * 0.12;
  const jx = dx * Math.cos(jitter) - dz * Math.sin(jitter);
  const jz = dx * Math.sin(jitter) + dz * Math.cos(jitter);
  const speed = (5.2 + powerVal * 0.075) / Math.sqrt(f.stats.mass);
  f.vx = jx * speed;
  f.vz = jz * speed;
  f.spin = 100; f.launched = true;
  f.mesh.visible = true;
}

function endBattle(win, reason){
  if (phase === 'done') return;
  phase = 'done';
  const titleEl = document.getElementById('result-title');
  const reasonEl = document.getElementById('result-reason');
  if (demoMode){
    // デモ対戦では勝った側のCPU名で結果を表示する
    titleEl.textContent = win ? 'CPU1 の勝ち！' : 'CPU2 の勝ち！';
    reasonEl.textContent = reason === 'finish' ? 'とどめの一撃！' : '回転のこりで決着';
  } else {
    const reasons = {
      win:  { finish:'とどめの一撃！', time:'回転のこりで 勝ち！' },
      lose: { finish:'とどめを 刺されてしまった', time:'回転のこりで 負け…' },
    };
    titleEl.textContent = win ? '勝ち！' : '負け…';
    reasonEl.textContent = reasons[win ? 'win' : 'lose'][reason];
  }
  setTimeout(() => {
    if (screen === 'battle'){
      document.getElementById('screen-result').classList.add('active');
      if (demoMode){
        // 結果を約3秒表示してから、次のデモ対戦を自動で始める
        demoTimer = setTimeout(startNextDemo, 3000);
      }
    }
  }, 700);
}

/* ================= 衝突タイミング判定 ================= */
function showClash(kind, text){
  clashMsg.textContent = text;
  timingRing.classList.remove('good', 'draw', 'bad');
  if (kind) timingRing.classList.add(kind);
  feedbackUntil = nowS() + 0.7;
}

/* 衝突の物理（跳ね返り）は即時適用し、スピンダメージだけをここに預ける。
   タップの「後から±TAP_WINDOW」も拾えるよう、窓が閉じてから resolvePendingClash で確定する */
function registerClash(dmgToP, dmgToC){
  firstClash = true;   // 初接触したので序盤ブーストはここで終わる
  if (pendingClash){
    pendingClash.dmgToP += dmgToP;
    pendingClash.dmgToC += dmgToC;
  } else {
    pendingClash = { t: nowS(), dmgToP, dmgToC };
  }
}

/* スピンが0になったコマを「瀕死」として記録する（この時点では試合は終わらない）。
   スピンは0でクランプし、どちらが先に瀕死になったかを dyingSeq（採番）で覚える */
function markDying(){
  for (const f of [fighters.player, fighters.cpu]){
    if (f.spin <= 0){
      f.spin = 0;
      if (!f.dying){ f.dying = true; f.dyingSeq = ++dyingCounter; }
    }
  }
}

/* 瀕死のコマがジャスト成功したときの復活：スピンを回復し、瀕死を解除する */
function reviveFighter(f){
  f.spin = REVIVE_SPIN;
  f.dying = false;
  f.dyingSeq = 0;
}

function resolvePendingClash(){
  if (!pendingClash || nowS() < pendingClash.t + TAP_WINDOW) return;
  const pc = pendingClash;
  pendingClash = null;
  const P = fighters.player, C = fighters.cpu;
  // デモ対戦では両者ともタップの代わりに確率でジャスト成否を決める（難易度は適用しない）。
  // 瀕死時の復活ジャストも、この pOK / cOK をそのまま使う
  const pOK = demoMode ? Math.random() < DEMO_JUST_RATE
                       : tapTimes.some(t => Math.abs(t - pc.t) <= TAP_WINDOW);
  const cOK = Math.random() < (demoMode ? DEMO_JUST_RATE : CPU_TAP_RATE);
  // ブーストの効果が残っている間（押下中・維持中・減衰中）に解決した衝突は、
  // ジャストの勝敗ダメージが BOOST_DMG 倍になる（勝てば大きく与え、負ければ大きく受ける）
  const boostRisk = currentBoostMult() > 1;
  // 瀕死のコマが関わる衝突は、通常の結果適用より先に決着／復活を判定する。
  // 瀕死側がジャストできれば復活して、この衝突は通常どおり解決する。
  // 瀕死側がジャストできなければ、その場で決着する
  if (P.dying || C.dying){
    const pFail = P.dying && !pOK;
    const cFail = C.dying && !cOK;
    if (pFail && cFail){
      // 両者とも瀕死で両方失敗：先に瀕死になった方（dyingSeqが小さい方）の負け
      return endBattle(P.dyingSeq > C.dyingSeq, 'finish');
    }
    if (pFail) return endBattle(false, 'finish');
    if (cFail) return endBattle(true, 'finish');
    if (P.dying) reviveFighter(P);
    if (C.dying) reviveFighter(C);
  }
  const pushLoser = (loser, winner) => {
    const dx = loser.x - winner.x, dz = loser.z - winner.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.01) return;
    const kb = KB_PUSH * (1 + FAIL_KB_RATE * loser.fails);
    loser.vx += (dx / d) * kb;
    loser.vz += (dz / d) * kb;
  };
  if (pOK && cOK){
    // 相殺：両者ノーダメージ。まず互いに跳ね返り（ノックバック）、
    // その後テンションの引き寄せで再接近する流れにする
    tension++;
    drawCount++;   // 相殺エスカレーション：回数を積み上げる（試合中リセットしない）
    const dx = C.x - P.x, dz = C.z - P.z;
    const d = Math.hypot(dx, dz);
    if (d > 0.01){
      // ノックバックは相殺回数に応じて大きくなる（今回の相殺自体を含む）
      const kb = KB_PUSH * 0.85 * (1 + DRAW_KB_RATE * drawCount);
      // 法線方向の跳ね返りに、各コマの現在位置における時計回りの接線成分を少し混ぜる。
      // 接線は周回力と同じ定義（位置ベクトルを90°回した向き × orbit）を使い、
      // 跳ね返った後も真っ直ぐ離れず、周回の流れを保ったまま離れるようにする
      const nx = dx / d, nz = dz / d;
      const pushWithTan = (f, dir) => {
        const r = Math.hypot(f.x, f.z);
        let tx = f.orbit, tz = 0;   // 中心付近では接線が定まらないので既定値
        if (r > 0.3){ tx = (-f.z / r) * f.orbit; tz = (f.x / r) * f.orbit; }
        f.vx += nx * dir * kb + tx * kb * DRAW_KB_TAN;
        f.vz += nz * dir * kb + tz * kb * DRAW_KB_TAN;
      };
      pushWithTan(P, -1);
      pushWithTan(C, +1);
    }
    // ペース倍率を永続的に引き上げ、両コマの現在の速度にも比率分を即座に掛けて
    // 「実際に速くなり続ける」形にする（上限 PACE_CAP）。速度上限・周回ペースへは
    // stepBattle 側で paceMult を介して反映される
    const newPace = Math.min(PACE_CAP, 1 + PACE_STEP * drawCount);
    if (newPace > paceMult){
      const kick = newPace / paceMult;
      paceMult = newPace;
      P.vx *= kick; P.vz *= kick;
      C.vx *= kick; C.vz *= kick;
    }
    triggerClashFX((P.x + C.x) / 2, (P.z + C.z) / 2, 0.55, true);
    addHitstop(0.06);
    showClash('draw', '相殺！');
  } else if (pOK){
    C.fails++;
    C.spin -= pc.dmgToC * CLASH_WIN_DMG * (boostRisk ? BOOST_DMG : 1);
    pushLoser(C, P);
    triggerClashFX(C.x, C.z, 0.85, true);
    addHitstop(0.08);
    showClash('good', 'ジャスト！');
  } else if (cOK){
    P.fails++;
    P.spin -= pc.dmgToP * CLASH_WIN_DMG * (boostRisk ? BOOST_DMG : 1);
    pushLoser(P, C);
    triggerClashFX(P.x, P.z, 0.85, true);
    addHitstop(0.08);
    showClash('bad', '失敗…');
  } else {
    P.fails++; C.fails++;
    P.spin -= pc.dmgToP;
    C.spin -= pc.dmgToC;
    showClash('bad', '失敗…');
  }
}

function stepBattle(dt){
  const P = fighters.player, C = fighters.cpu;
  fightTime += dt;

  resolvePendingClash();
  if (phase !== 'fight') return;   // 衝突の解決で決着した場合はここで止める
  markDying();   // 衝突ダメージでスピンが0になったコマを瀕死として記録する

  if (cpuTimer > 0){
    cpuTimer -= dt;
    if (cpuTimer <= 0) launchFighter(C, CPU_START_HOUR, CPU_TARGET_HOUR, 45 + Math.random() * 50);
  }

  const boostMult = currentBoostMult();   // プレイヤーのブースト倍率（このフレームの値）
  for (const f of [P, C]){
    if (!f.launched) continue;
    // このコマの速度スケール：両コマ共通のペース倍率 ×（プレイヤーのみ）ブースト倍率
    const spdScale = paceMult * (f === P ? boostMult : 1);
    // スピン減衰（かいてんが高いほど長持ち）
    f.spin -= spinDecayPerSec(f.stats.st) * dt;
    const d = Math.hypot(f.x, f.z);
    // すり鉢効果：斜面に沿って中心へ引かれる（距離に比例。傾斜強化で係数2.4→3.0）
    // 縁（ARENA_R）の外側では斜面が下向きに転じるので、外へ滑り落ちる力に切り替える
    if (d > 0.01){
      const a = d <= ARENA_R ? SLOPE_PULL * d : -4.4;
      f.vx -= (f.x / d) * a * dt;
      f.vz -= (f.z / d) * a * dt;
    }
    // 摩擦（旧0.5→0.22に弱めて、滑りが長続きするように）
    const fr = Math.exp(-0.22 * dt);
    f.vx *= fr; f.vz *= fr;
    // 静止させない：進行方向を曲げて土俵を周回させる力＋最低速度の維持。
    // 移動の挙動はスピン量に依存しない（スピン0＝瀕死でも今まで通り動き回る）。
    // スピンが効くのは数値管理（ダメージ・減衰・瀕死判定）と
    // 見た目のフラフラ（syncFighters 側）だけに限定する
    {
      const spd = Math.hypot(f.vx, f.vz);
      if (spd > 0.05){
        // 速度に垂直な向きの力（強さはスピン残量によらず一定）。両者とも時計回り
        const px = -f.vz / spd, pz = f.vx / spd;
        const drive = 1.15 * spdScale;
        f.vx += px * f.orbit * drive * dt;
        f.vz += pz * f.orbit * drive * dt;
      }
      if (spd < 0.55 * spdScale){
        // 止まりそうになったら、土俵の接線方向へそっと押し出す
        let tx, tz;
        if (d > 0.3){ tx = (-f.z / d) * f.orbit; tz = (f.x / d) * f.orbit; }
        else { tx = f.orbit; tz = 0; }
        f.vx += tx * 2.4 * spdScale * dt;
        f.vz += tz * 2.4 * spdScale * dt;
      }
    }
    // 速度の上限（斜面加速での暴走防止）
    {
      const spd = Math.hypot(f.vx, f.vz);
      const cap = 13 * spdScale;
      if (spd > cap){ f.vx *= cap / spd; f.vz *= cap / spd; }
    }
    // ※フラつきの速度ノイズは廃止した（軌道を乱していたため）。
    //   フラフラは syncFighters でメッシュの表示位置・傾きだけに付けている
    f.x += f.vx * dt;
    f.z += f.vz * dt;
    // 縁のヘリ（常時ガードレール）：コマは決して場外に出ない。
    // ヘリに到達したら位置を内側にクランプし、外向き（径方向）速度だけを
    // 反発係数0.55で跳ね返す。接線成分は保持するので、周回の流れは止まらない
    {
      const dLip = Math.hypot(f.x, f.z);
      if (dLip > LIP_R){
        const nx = f.x / dLip, nz = f.z / dLip;
        f.x = nx * LIP_R; f.z = nz * LIP_R;
        const vr = f.vx * nx + f.vz * nz;   // 外向きの径方向速度
        if (vr > 0){
          f.vx -= (1 + 0.55) * vr * nx;
          f.vz -= (1 + 0.55) * vr * nz;
        }
      }
    }
  }

  // テンションによる引き寄せ（相殺が続くほど接近が速くなり、タップが難しくなる）
  if (tension > 0 && P.launched && C.launched){
    const dx = C.x - P.x, dz = C.z - P.z;
    const d = Math.hypot(dx, dz);
    if (d > 0.01){
      const a = TENSION_PULL * Math.min(tension, TENSION_CAP) * dt;
      P.vx += (dx / d) * a; P.vz += (dz / d) * a;
      C.vx -= (dx / d) * a; C.vz -= (dz / d) * a;
    }
  }

  // 序盤ブースト：発射直後の数秒だけ、両者を引き寄せる追加の力をかけて初接触を早める。
  // OPENING_TIME 秒かけて線形に減衰し、初接触した時点でも終了するため、
  // 中盤以降の物理（すり鉢の引力・摩擦・周回力・テンション等の基本定数）には影響しない
  if (!firstClash && fightTime < OPENING_TIME && P.launched && C.launched){
    const dx = C.x - P.x, dz = C.z - P.z;
    const d = Math.hypot(dx, dz);
    if (d > 0.01){
      const a = OPENING_PULL * (1 - fightTime / OPENING_TIME) * dt;
      P.vx += (dx / d) * a; P.vz += (dz / d) * a;
      C.vx -= (dx / d) * a; C.vz -= (dz / d) * a;
    }
  }

  // コマ同士の衝突
  if (P.launched && C.launched){
    const dx = C.x - P.x, dz = C.z - P.z;
    const dist = Math.hypot(dx, dz);
    const minDist = P.stats.radius + C.stats.radius;
    if (dist > 0.0001 && dist < minDist){
      const nx = dx / dist, nz = dz / dist;
      const mP = P.stats.mass * (1 + P.stats.st.stab * 0.04);
      const mC = C.stats.mass * (1 + C.stats.st.stab * 0.04);
      const invP = 1 / mP, invC = 1 / mC, invSum = invP + invC;
      // めり込み解消
      const overlap = minDist - dist;
      P.x -= nx * overlap * (invP / invSum); P.z -= nz * overlap * (invP / invSum);
      C.x += nx * overlap * (invC / invSum); C.z += nz * overlap * (invC / invSum);
      // 接近している時だけインパルスとスピンダメージ
      const rvn = (C.vx - P.vx) * nx + (C.vz - P.vz) * nz;
      if (rvn < 0){
        const jimp = -(1 + 0.9) * rvn / invSum;
        P.vx -= jimp * invP * nx; P.vz -= jimp * invP * nz;
        C.vx += jimp * invC * nx; C.vz += jimp * invC * nz;
        // ノックバック強化：衝突の強さに比例した追加の押し出しで、
        // ぶつかったコマ同士が目に見えて弾き合って離れるようにする。
        // 追加する相対分離速度は push 本体（弱い接触で約0.9、強い衝突で約4.1）で、
        // 質量の逆数比で両者へ配分する。土俵の物理定数には触れない
        const strength = Math.min(1, Math.abs(rvn) / 9);
        const push = 0.5 + 3.6 * strength;
        P.vx -= nx * push * (invP / invSum); P.vz -= nz * push * (invP / invSum);
        C.vx += nx * push * (invC / invSum); C.vz += nz * push * (invC / invSum);
        const impact = 0.6 + Math.min(1.4, Math.abs(rvn) * 0.12);
        // 接触点で演出（火花・衝撃波・シェイク・効果音）。強い衝突ではヒットストップも
        triggerClashFX(P.x + nx * P.stats.radius, P.z + nz * P.stats.radius, strength, false);
        if (strength > 0.5) addHitstop(0.06);
        const dmg = (atkF, defF) => Math.max(0.3,
          (1.0 + Math.max(-2, Math.min(8, atkF.stats.st.atk - defF.stats.st.def)) * 0.55
            + (atkF.stats.spike ? 2.2 : 0)) * impact);
        // スピンダメージは即時適用せず、タップ判定（resolvePendingClash）に委ねる
        registerClash(dmg(C, P), dmg(P, C));
      }
    }
  }

  // 瀕死の記録：スピンが0になっても試合は終わらない（決着は次の接触で決まる）
  markDying();
  // 制限時間（保険）：残りスピンが多い方の勝ち。
  // 両方ともスピン0（瀕死）なら、先に瀕死になった方の負け
  if (fightTime > 90){
    if (P.spin !== C.spin) return endBattle(P.spin > C.spin, 'time');
    if (P.dying && C.dying) return endBattle(P.dyingSeq > C.dyingSeq, 'time');
    return endBattle(true, 'time');
  }
}

/* --- 瀕死サイン（本体とゲージの赤色点滅） --- */
const DYING_RED = new THREE.Color(0xe0331e);
const DYING_PERIOD = 0.4;   // 点滅の周期（秒）
const GAUGE_P = 'linear-gradient(90deg,#e8a34c,#cf6f2a)';
const GAUGE_C = 'linear-gradient(90deg,#a9c46a,#7a9a4d)';
const GAUGE_RED_ON  = 'linear-gradient(90deg,#f0563f,#d42a16)';
const GAUGE_RED_OFF = 'linear-gradient(90deg,#93382c,#701a10)';

function syncFighters(dt, t){
  if (!fighters) return;
  const blinkOn = (t % DYING_PERIOD) < DYING_PERIOD / 2;
  for (const f of [fighters.player, fighters.cpu]){
    if (!f.launched) continue;
    const d = Math.hypot(f.x, f.z);
    let y = bowlY(Math.min(d, ARENA_R + 0.6));
    const spinNow = Math.max(0, f.spin);
    // フラフラは見た目だけ：スピンが弱いほどメッシュの表示位置を小さく揺らす
    // （物理位置 f.x/f.z には一切触れない。揺れの大きさは あんてい で軽減）
    let jx = 0, jz = 0;
    if (spinNow < 50){
      const wob = (50 - spinNow) / 50;
      const amp = wob * Math.max(0.3, 1.6 - f.stats.st.stab * 0.13) * 0.055;
      jx = Math.sin(t * 13.7 + f.phase * 3.1) * amp;
      jz = Math.cos(t * 11.3 + f.phase * 2.3) * amp;
    }
    f.mesh.position.set(f.x + jx, y, f.z + jz);
    f.mesh.userData.spinG.rotation.y += f.spinDir * (3 + spinNow * 0.45) * dt;
    const tilt = (1 - spinNow / 100) * 0.30;
    f.mesh.rotation.x = Math.cos(t * 6.7 + f.phase) * tilt * 0.5;
    f.mesh.rotation.z = Math.sin(t * 8.0 + f.phase) * tilt * 0.5;
    // 瀕死サイン：本体（実と帽子）を赤く点滅させる。復活すれば元の色に戻る
    if (f.mesh.userData.blink){
      for (const b of f.mesh.userData.blink){
        if (f.dying && blinkOn){
          b.mat.color.copy(b.base).lerp(DYING_RED, 0.78);
          b.mat.emissive.copy(DYING_RED);
          b.mat.emissiveIntensity = 0.5;
        } else if (f.dying){
          b.mat.color.copy(b.base).lerp(DYING_RED, 0.28);
          b.mat.emissive.setRGB(0, 0, 0);
          b.mat.emissiveIntensity = 0;
        } else {
          b.mat.color.copy(b.base);
          b.mat.emissive.setRGB(0, 0, 0);
          b.mat.emissiveIntensity = 0;
        }
      }
    }
  }
  spinBarP.style.width = Math.max(0, fighters.player.spin) + '%';
  spinBarC.style.width = Math.max(0, fighters.cpu.spin) + '%';
  // 瀕死サイン：そのコマ側のゲージも赤く点滅させる
  spinBarP.style.background = fighters.player.dying ? (blinkOn ? GAUGE_RED_ON : GAUGE_RED_OFF) : GAUGE_P;
  spinBarC.style.background = fighters.cpu.dying ? (blinkOn ? GAUGE_RED_ON : GAUGE_RED_OFF) : GAUGE_C;
}

/* --- 発射操作（長押し） --- */
launchBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  if (demoMode) return;   // デモ対戦ではボタン自体が無効
  if (phase === 'ready'){
    charging = true; power = 0;
  } else if (phase === 'fight'){
    // 発射後は同じボタンがブーストボタンとして働く
    boostHeld = true;
    boostPointerId = e.pointerId;
  }
});
/* 両コマを同時に発射してバトルを開始する（通常モード・デモ対戦で共用） */
function launchBoth(pPower, cPower){
  launchFighter(fighters.player, PLAYER_START_HOUR, PLAYER_TARGET_HOUR, pPower);
  launchFighter(fighters.cpu, CPU_START_HOUR, CPU_TARGET_HOUR, cPower);
  phase = 'fight'; fightTime = 0; cpuTimer = -1;
  // 発射後は同じボタンを「ブースト」に切り替える（デモ対戦ではボタンを出さないので無効のまま）
  if (demoMode) launchBtn.disabled = true;
  else { launchBtn.disabled = false; launchBtn.textContent = 'ブースト'; }
  powerFill.style.width = '0%';
}
function releaseLaunch(){
  if (!charging) return;
  charging = false;
  if (phase !== 'ready' || !fighters) return;
  launchBoth(power, 45 + Math.random() * 50);   // CPUも同時に発射（着地タイミングを揃える）
}
window.addEventListener('pointerup', releaseLaunch);
window.addEventListener('pointercancel', releaseLaunch);

/* --- ブーストの状態遷移 ---
   押下中は BOOST_MULT。離すと BOOST_KEEP 秒はそのまま維持し、
   続く BOOST_FADE 秒で通常速度（×1.0）へ戻る。維持・減衰中に再び押せば即ブーストに戻る */
function currentBoostMult(){
  if (demoMode || phase !== 'fight') return 1;
  if (boostHeld) return BOOST_MULT;
  const since = nowS() - boostReleaseT;
  if (since < BOOST_KEEP) return BOOST_MULT;
  if (since < BOOST_KEEP + BOOST_FADE) return 1 + (BOOST_MULT - 1) * (1 - (since - BOOST_KEEP) / BOOST_FADE);
  return 1;
}
/* ブーストの解除は、押したポインタが離れたときだけ（別の指のタップで誤って解除しない） */
function releaseBoost(e){
  if (boostHeld && e.pointerId === boostPointerId){
    boostHeld = false;
    boostPointerId = null;
    boostReleaseT = nowS();
  }
}
window.addEventListener('pointerup', releaseBoost);
window.addEventListener('pointercancel', releaseBoost);

/* --- ブースト中の残像（簡素版） ---
   ブースト中のプレイヤーのコマのゴーストを薄く残すだけの軽い演出。
   ゴーストはプール化し（組み立てが変わったら作り直す）、個別マテリアルの
   opacity でフェードさせる。重いパーティクル類は使わない */
const TRAIL_MAX = 12;          // 同時に残す残像の数
const TRAIL_LIFE = 0.35;       // 残像が消えるまでの秒数
const TRAIL_INTERVAL = 0.04;   // 残像を置く間隔（秒）
const TRAIL_OPACITY = 0.30;    // 残像の最大の濃さ
let trailGhosts = [];          // { obj, spinG, mat, life }
let trailKey = '';
let trailTimer = 0;

function clearTrailPool(){
  for (const g of trailGhosts){
    battleScene.remove(g.obj);
    g.obj.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && o.material !== g.mat) o.material.dispose();
    });
    g.mat.dispose();
  }
  trailGhosts = [];
  trailKey = '';
}

function ensureTrailPool(sel){
  const key = JSON.stringify(sel);
  if (key === trailKey && trailGhosts.length) return;
  clearTrailPool();
  trailKey = key;
  for (let i = 0; i < TRAIL_MAX; i++){
    const obj = buildTopMesh(sel, 'player');
    const mat = new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0, depthWrite: false });
    obj.traverse(o => {
      if (o.isMesh){
        o.material.dispose();   // buildTopMesh が作ったマテリアルは使わないので破棄
        o.material = mat;
        o.castShadow = false;
        o.receiveShadow = false;
      }
    });
    obj.visible = false;
    battleScene.add(obj);
    trailGhosts.push({ obj, spinG: obj.userData.spinG, mat, life: 0 });
  }
}

function updateTrail(dt){
  const P = fighters && fighters.player;
  const boosting = !demoMode && phase === 'fight' && P && P.launched && currentBoostMult() > 1;
  if (boosting){
    ensureTrailPool(P.sel);
    trailTimer -= dt;
    if (trailTimer <= 0){
      trailTimer = TRAIL_INTERVAL;
      const slot = trailGhosts.find(g => g.life <= 0) || trailGhosts[0];
      if (slot){
        // 本体の表示姿勢（位置・傾き・自転）をそのまま写す
        slot.obj.position.copy(P.mesh.position);
        slot.obj.rotation.copy(P.mesh.rotation);
        if (slot.spinG && P.mesh.userData.spinG) slot.spinG.rotation.y = P.mesh.userData.spinG.rotation.y;
        slot.life = TRAIL_LIFE;
        slot.obj.visible = true;
      }
    }
  } else {
    trailTimer = 0;
  }
  for (const g of trailGhosts){
    if (g.life <= 0) continue;
    g.life -= dt;
    if (g.life <= 0){ g.obj.visible = false; g.mat.opacity = 0; continue; }
    g.mat.opacity = TRAIL_OPACITY * (g.life / TRAIL_LIFE);
  }
}

/* --- 衝突タイミング用のタップ記録（バトル中、画面のどこでもよい） --- */
window.addEventListener('pointerdown', e => {
  // ブーストボタン上のポインタ操作はジャスト判定のタップとして記録しない
  if (e.target.closest && e.target.closest('#launch-btn')) return;
  if (screen === 'battle' && phase === 'fight') tapTimes.push(nowS());
});

/* --- ブーストボタンの表示 ---
   押下中＝赤（.boosting）、離した後の維持フェーズ＝橙（.boost-keep）、
   減衰フェーズ＝残り倍率の割合で維持色から通常色へ徐々に戻す。
   指を離した後も「まだリスク期間中」と読めるようにするための表示 */
const BOOST_BTN_KEEP = new THREE.Color(0xe86a1e);   // 維持フェーズの色
const BOOST_BTN_BASE = new THREE.Color(0xcf6f2a);   // 通常色（--accent と同じ）
const _boostBtnCol = new THREE.Color();
function updateBoostBtn(){
  const m = (!demoMode && phase === 'fight') ? currentBoostMult() : 1;
  launchBtn.classList.remove('boosting', 'boost-keep');
  if (m <= 1){
    launchBtn.style.background = '';
    launchBtn.style.boxShadow = '';
    return;
  }
  if (boostHeld){
    launchBtn.classList.add('boosting');
    launchBtn.style.background = '';
    launchBtn.style.boxShadow = '';
  } else if (nowS() - boostReleaseT < BOOST_KEEP){
    launchBtn.classList.add('boost-keep');
    launchBtn.style.background = '';
    launchBtn.style.boxShadow = '';
  } else {
    // 減衰フェーズ：倍率が通常へ戻るにつれて色も通常色へ
    const k = (m - 1) / (BOOST_MULT - 1);
    _boostBtnCol.copy(BOOST_BTN_BASE).lerp(BOOST_BTN_KEEP, k);
    launchBtn.style.background = '#' + _boostBtnCol.getHexString();
    launchBtn.style.boxShadow = '';
  }
}

/* --- タイミング円の表示更新 --- */
function updateTimingUI(){
  if (!fighters) { timingRing.style.opacity = '0'; return; }
  updateBoostBtn();
  const P = fighters.player, C = fighters.cpu;
  const active = phase === 'fight' && P.launched && C.launched;
  timingRing.style.opacity = active ? '1' : '0';
  if (active){
    // 円の大きさはボディの縁同士の間隔（gap）に連動し、gap=0（接触）で点になる。
    // 平方根カーブなので、遠いときは縮みが遅く、近くなるにつれて徐々に速く縮む。
    // 中距離でも円のサイズが保たれて判定円として認識しやすく、最後はドットへ
    // 吸い込まれるように縮む
    const dist = Math.hypot(C.x - P.x, C.z - P.z);
    const gap = Math.max(0, dist - (P.stats.radius + C.stats.radius));
    const k = Math.min(1, gap / GAP_MAX);
    timingRing.style.transform = `scale(${Math.sqrt(k).toFixed(3)})`;
  }
  if (feedbackUntil && nowS() > feedbackUntil){
    feedbackUntil = 0;
    clashMsg.textContent = '';
    timingRing.classList.remove('good', 'draw', 'bad');
  }
  // 古いタップ記録の掃除
  const cutoff = nowS() - 1;
  while (tapTimes.length && tapTimes[0] < cutoff) tapTimes.shift();
}
launchBtn.addEventListener('contextmenu', e => e.preventDefault());

/* ================= デモ対戦（CPU同士の自動対戦） =================
   組み立ては両者ともランダム、発射は自動、ジャスト判定は DEMO_JUST_RATE の確率。
   バトルの物理・ルール（衝突・相殺・テンション・瀕死と決着・制限時間）は
   通常モードと完全に同じコードを通し、入力（発射とジャスト）だけを差し替える */
function startDemo(){
  demoMode = true;
  clearTimeout(demoTimer);
  nameP.textContent = 'CPU1';   // 茶色側（player枠）
  nameC.textContent = 'CPU2';   // 緑側（cpu枠）
  launchBtn.style.display = 'none';
  powerBarWrap.style.display = 'none';
  demoExitBtn.style.display = '';
  resultBtns.style.display = 'none';
  // 結果表示中でも「タイトルへ」に触れるよう、デモ中は結果オーバーレイをクリック透過にする
  resultScreen.style.pointerEvents = 'none';
  cpuBuild = randomBuild();
  startBattle(randomBuild());
  showScreen('battle');
  scheduleDemoLaunch();
}
function scheduleDemoLaunch(){
  clearTimeout(demoTimer);
  // 短い溜め（1秒弱）の後、両者同時に発射。パワーは両者ともランダム（45〜95）
  demoTimer = setTimeout(() => {
    if (!demoMode || screen !== 'battle' || phase !== 'ready' || !fighters) return;
    launchBoth(45 + Math.random() * 50, 45 + Math.random() * 50);
  }, 900);
}
function startNextDemo(){
  if (!demoMode) return;
  resultScreen.classList.remove('active');
  cpuBuild = randomBuild();
  startBattle(randomBuild());
  scheduleDemoLaunch();
}
function stopDemo(){
  demoMode = false;
  clearTimeout(demoTimer);
  nameP.textContent = 'あなた';
  nameC.textContent = 'CPU';
  launchBtn.style.display = '';
  powerBarWrap.style.display = '';
  demoExitBtn.style.display = 'none';
  resultBtns.style.display = '';
  resultScreen.style.pointerEvents = '';
  showScreen('title');
}
document.getElementById('demo-btn').addEventListener('click', () => { ensureAudio(); startDemo(); });
demoExitBtn.addEventListener('click', stopDemo);

/* --- バトルまわりのボタン --- */
document.getElementById('battle-btn').addEventListener('click', () => {
  ensureAudio();
  cpuBuild = randomBuild();
  startBattle();
  showScreen('battle');
});
document.getElementById('rematch-btn').addEventListener('click', () => {
  document.getElementById('screen-result').classList.remove('active');
  startBattle();
});
document.getElementById('rebuild-btn').addEventListener('click', () => {
  showScreen('build');
});

/* ================= リサイズとメインループ ================= */
/* バトルカメラのフィット計算：
   視点の向き（斜め見下ろし）は今まで通り (0, 11, 8.8) 方向に固定し、
   土俵の外周（縁・リム・ヘリを含む）上の点がすべて画面内（NDCで±0.96以内）に
   収まる距離を二分探索で求める。横幅が制約になる縦持ちでも左右が見切れない。 */
const battleDir = new THREE.Vector3(0, 11, 8.8).normalize();
const battleCamBase = new THREE.Vector3(0, 20, 16);   // フィットで決まったカメラ位置（シェイクの基準）
const fitPoints = [];
for (let i = 0; i < 24; i++){
  const a = (i / 24) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
  fitPoints.push(new THREE.Vector3(6.60 * ca, 1.45, 6.60 * sa));  // すり鉢の外周（深さ1.5に合わせた高さ）
  fitPoints.push(new THREE.Vector3(6.48 * ca, 1.86, 6.48 * sa));  // リムの外周・上端（リム中心1.73＋管半径0.13）
}
fitPoints.push(new THREE.Vector3(0, 1.86, 0));
const _fitV = new THREE.Vector3();
function battleFits(d){
  battleCam.position.copy(battleDir).multiplyScalar(d);
  battleCam.lookAt(0, 0, 0);
  battleCam.updateMatrixWorld();
  for (const p of fitPoints){
    _fitV.copy(p).project(battleCam);
    if (Math.abs(_fitV.x) > 0.96 || Math.abs(_fitV.y) > 0.96 || _fitV.z > 1) return false;
  }
  return true;
}
function fitBattleCamera(){
  battleCam.updateProjectionMatrix();
  let lo = 6, hi = 90;
  while (!battleFits(hi) && hi < 400) hi *= 1.5;   // 収まる上限の確保（通常は不要）
  for (let i = 0; i < 28; i++){
    const mid = (lo + hi) / 2;
    if (battleFits(mid)) hi = mid; else lo = mid;
  }
  battleFits(hi);   // 最終位置をカメラに反映
  battleCamBase.copy(battleCam.position);
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  previewCam.aspect = w / h;
  previewCam.updateProjectionMatrix();
  battleCam.aspect = w / h;
  fitBattleCamera();
}
window.addEventListener('resize', onResize);
onResize();

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.033, clock.getDelta());
  const t = clock.elapsedTime;
  // 描画領域（ビューポート）を切り替えるため、まず全画面をクリアしておく
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.clear();
  if (screen === 'battle'){
    if (charging){
      power = Math.min(100, power + dt * 95);
      powerFill.style.width = power + '%';
    }
    // ヒットストップ：短時間だけバトル全体の時間経過をほぼ止める
    let bdt = dt;
    if (hitstop > 0){ hitstop -= dt; bdt = dt * 0.06; }
    if (phase === 'fight') stepBattle(bdt);
    syncFighters(bdt, t);
    updateFX(bdt);
    updateTrail(bdt);
    updateTimingUI();
    // カメラ：フィット位置を基準に、シェイクの残り時間に応じてランダムにずらす
    battleCam.position.copy(battleCamBase);
    if (shakeT > 0){
      shakeT -= dt;
      const k = Math.max(0, shakeT / shakeDur) * shakeAmp;
      battleCam.position.x += (Math.random() * 2 - 1) * k;
      battleCam.position.y += (Math.random() * 2 - 1) * k * 0.6;
      battleCam.position.z += (Math.random() * 2 - 1) * k;
    }
    battleCam.lookAt(0, 0, 0);
    renderer.render(battleScene, battleCam);
  } else {
    if (previewTop) previewTop.userData.spinG.rotation.y += dt * 1.4;
    if (screen === 'build'){
      // プレビューはパネルより上の領域だけに描く（設定項目と重ねない）
      // カメラを引いて、コマの表示サイズはタイトル画面の約70%にする
      const rect = document.getElementById('build-preview-space').getBoundingClientRect();
      previewCam.aspect = rect.width / Math.max(1, rect.height);
      previewCam.position.set(0, 2.6, 7.54);
      previewCam.lookAt(0, 1.0, 0);
      previewCam.updateProjectionMatrix();
      const vy = window.innerHeight - rect.bottom;
      renderer.setScissorTest(true);
      renderer.setViewport(rect.left, vy, rect.width, rect.height);
      renderer.setScissor(rect.left, vy, rect.width, rect.height);
    } else {
      previewCam.aspect = window.innerWidth / window.innerHeight;
      previewCam.position.set(0, 2.1, 5.2);
      previewCam.lookAt(0, 1.0, 0);
      previewCam.updateProjectionMatrix();
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    }
    renderer.render(previewScene, previewCam);
  }
}
animate();
