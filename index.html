<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>どんぐりコマバトル</title>
<style>
  :root{
    --ink:#4a3421;
    --accent:#cf6f2a;
    --accent-dark:#a8561c;
    --panel:rgba(255,250,238,.96);
    --line:#d8c49a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent;
     user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  /* デバッグ用の数値入力欄だけは通常どおり入力・選択できるようにする */
  input{ user-select:text; -webkit-user-select:text; -webkit-touch-callout:default; }
  html,body{ height:100%; }
  body{
    margin:0; color:var(--ink); overflow:hidden; overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    background:#f3e5c8; touch-action:none;
  }
  #stage{ position:fixed; inset:0; }
  #stage canvas{ display:block; }
  .screen{ position:fixed; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- タイトル ---------- */
  #screen-title{ align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at center, rgba(255,246,225,0) 40%, rgba(84,50,16,.28) 100%); }
  #screen-title h1{ font-size:clamp(34px,9vw,54px); margin:0 0 28px; letter-spacing:.04em;
    color:#6e4520; text-shadow:0 2px 0 #fff3d6, 0 4px 14px rgba(110,69,32,.35); }
  .btn{
    font:inherit; font-weight:700; font-size:19px; color:#fff; background:var(--accent);
    border:none; border-radius:999px; padding:15px 40px; cursor:pointer;
    box-shadow:0 4px 0 var(--accent-dark), 0 8px 18px rgba(110,69,32,.3);
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--accent-dark); }
  .btn.sub{ background:#fffdf6; color:var(--ink); border:2px solid var(--accent);
    box-shadow:0 4px 0 #d8c49a; font-size:16px; padding:12px 26px; }
  #screen-title .btn.sub{ margin-top:14px; }

  /* ---------- 組み立て ---------- */
  #build-preview-space{ flex:1 1 auto; min-height:0; position:relative; }
  #build-panel{
    background:var(--panel); border-radius:22px 22px 0 0;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(110,69,32,.18); max-height:54%; overflow-y:auto;
  }
  .group-label{ font-size:12px; font-weight:700; color:#9a7748; margin:10px 0 5px; letter-spacing:.08em; }
  .num-input{ font:inherit; font-size:14px; padding:8px 12px; width:110px; border-radius:999px;
    background:#fffdf6; color:var(--ink); border:2px solid var(--line); }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    font:inherit; font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer;
    background:#fffdf6; color:var(--ink); border:2px solid var(--line);
  }
  .chip.sel{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  /* ステータスウィンドウ：プレビューの右横に重ねるパネル */
  #stats-panel{
    position:absolute; top:10px; right:10px; width:42%; max-width:200px;
    background:rgba(255,250,238,.88); border:1.5px solid var(--line); border-radius:14px;
    padding:10px 12px; box-shadow:0 4px 14px rgba(110,69,32,.15);
    pointer-events:none;
  }
  #stats-panel .stats{ display:flex; flex-direction:column; gap:7px; }
  #stats-panel .stat{ display:flex; align-items:center; gap:7px; font-size:12px; }
  #stats-panel .slabel{ width:3.9em; flex:none; white-space:nowrap; color:#7a5a36; font-weight:700; }
  #stats-panel .marks{ display:flex; align-items:center; flex-wrap:wrap; row-gap:2px; }
  #stats-panel .ic{ color:var(--accent); line-height:1; }
  #stats-panel .ic.s10{ font-size:16px; }
  #stats-panel .ic.s5{ font-size:12.5px; }
  #stats-panel .ic.s1{ font-size:9.5px; }
  #stats-panel .icgap{ width:5px; flex:none; }
  #build-panel .btn{ width:100%; margin-top:12px; }

  /* ---------- バトル ---------- */
  #hud{ padding:calc(10px + env(safe-area-inset-top)) 16px 0; display:flex; flex-direction:column; gap:6px;
    pointer-events:none; }
  .hud-row{ display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700;
    text-shadow:0 1px 0 rgba(255,250,238,.8); }
  .hud-row .hname{ width:3.4em; }
  .hud-row .bar{ flex:1; height:12px; background:rgba(255,253,246,.75); border:2px solid var(--line);
    border-radius:6px; overflow:hidden; }
  .hud-row .fill{ height:100%; width:100%; transition:width .12s linear; }
  #spin-player{ background:linear-gradient(90deg,#e8a34c,#cf6f2a); }
  #spin-cpu{ background:linear-gradient(90deg,#a9c46a,#7a9a4d); }
  #power-wrap{ margin-top:auto; padding:14px 18px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:12px; }
  #power-bar-wrap{ width:82%; max-width:340px; height:16px; background:rgba(255,253,246,.8);
    border:2px solid var(--line); border-radius:8px; overflow:hidden; }
  #power-fill{ height:100%; width:0%; background:linear-gradient(90deg,#e8a34c,#d23c1e); }
  #launch-btn{ touch-action:none; user-select:none; -webkit-user-select:none; }
  #launch-btn:disabled{ opacity:.45; box-shadow:none; }
  #launch-btn.boosting{ background:#d23c1e; box-shadow:0 4px 0 #8e2412, 0 8px 18px rgba(110,69,32,.3); }
  #launch-btn.boost-keep{ background:#e86a1e; box-shadow:0 4px 0 #a8561c, 0 8px 18px rgba(110,69,32,.3); }
  /* ブーストゲージ（画面上部、プレイヤーの体力ゲージの下の細いバー。
     下部のボタン操作で指に隠れないよう上部に置く）。状態でフィル色を変える：
     使用中＝赤系、回復中＝くすんだ青灰、クールタイム中（Maxだが待ち）＝金、
     使用可能＝通常の橙グラデーション */
  #boost-gauge-wrap, #boost-gauge-wrap-cpu{ flex:1; height:8px; background:rgba(255,253,246,.8);
    border:2px solid var(--line); border-radius:5px; overflow:hidden; }
  #boost-row .hname, #boost-row-cpu .hname{ width:44px; font-size:10px; }
  #boost-gauge-fill, #boost-gauge-fill-cpu{ height:100%; width:100%; background:linear-gradient(90deg,#e8a34c,#cf6f2a);
    transition:width .1s linear; }
  #boost-gauge-wrap.using #boost-gauge-fill, #boost-gauge-wrap-cpu.using #boost-gauge-fill-cpu{ background:linear-gradient(90deg,#e86a1e,#d23c1e); }
  #boost-gauge-wrap.recovering #boost-gauge-fill, #boost-gauge-wrap-cpu.recovering #boost-gauge-fill-cpu{ background:#9db4c0; }
  #boost-gauge-wrap.cooldown #boost-gauge-fill, #boost-gauge-wrap-cpu.cooldown #boost-gauge-fill-cpu{ background:#c9a227; }
  #boost-gauge-wrap.ready-flash, #boost-gauge-wrap-cpu.ready-flash{ animation:boostReady .7s ease-out; }
  @keyframes boostReady{
    0%{ box-shadow:0 0 0 0 rgba(207,111,42,0); }
    30%{ box-shadow:0 0 0 7px rgba(207,111,42,.5); }
    100%{ box-shadow:0 0 0 0 rgba(207,111,42,0); }
  }
  #battle-msg{ font-size:14px; font-weight:700; color:#6e4520; text-shadow:0 1px 0 rgba(255,250,238,.9);
    min-height:1.3em; }

  /* ---------- タイミング円 ---------- */
  #timing-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px;
    height:150px; justify-content:flex-end; }
  #timing-ring{ width:118px; height:118px; border-radius:50%; flex:none; position:relative;
    border:4px solid var(--accent);
    background:radial-gradient(circle, rgba(207,111,42,.20), rgba(207,111,42,.04) 70%);
    opacity:0; transition:opacity .2s; }
  #timing-ring::after{ content:''; position:absolute; left:50%; top:50%; width:10px; height:10px;
    border-radius:50%; background:var(--accent-dark); transform:translate(-50%,-50%); }
  #timing-ring.good{ border-color:#7a9a4d;
    background:radial-gradient(circle, rgba(122,154,77,.35), rgba(122,154,77,.08) 70%); }
  #timing-ring.draw{ border-color:#c9a227;
    background:radial-gradient(circle, rgba(201,162,39,.35), rgba(201,162,39,.08) 70%); }
  #timing-ring.bad{ border-color:#b0483a;
    background:radial-gradient(circle, rgba(176,72,58,.32), rgba(176,72,58,.07) 70%); }
  #clash-msg{ font-size:15px; font-weight:800; color:#6e4520; min-height:1.3em;
    text-shadow:0 1px 0 rgba(255,250,238,.9); }

  /* ---------- 結果 ---------- */
  #screen-result{ align-items:center; justify-content:center; background:rgba(74,45,18,.35); }
  #result-card{ background:var(--panel); border-radius:22px; padding:30px 34px; text-align:center;
    box-shadow:0 12px 32px rgba(60,35,10,.35); max-width:84vw; }
  #result-title{ font-size:38px; font-weight:800; margin:0 0 6px; color:#6e4520; }
  #result-reason{ margin:0 0 22px; font-size:14px; color:#7a5a36; }
  #result-card .btns{ display:flex; flex-direction:column; gap:12px; align-items:center; }
</style>
</head>
<body>
<div id="stage"></div>

<!-- タイトル -->
<div id="screen-title" class="screen active">
  <h1>どんぐり<br>コマバトル</h1>
  <button id="play-btn" class="btn">あそぶ</button>
  <button id="demo-btn" class="btn sub">デモ対戦</button>
</div>

<!-- 組み立て -->
<div id="screen-build" class="screen">
  <div id="build-preview-space">
    <div id="stats-panel"><div class="stats" id="stats"></div></div>
  </div>
  <div id="build-panel">
    <div class="group-label">パンツ</div>
    <div class="chips" id="chips-pants"></div>
    <div class="group-label">本体</div>
    <div class="chips" id="chips-body"></div>
    <div class="group-label">オプション</div>
    <div class="chips" id="chips-option"></div>
    <div class="group-label">難易度</div>
    <div class="chips" id="chips-difficulty"></div>
    <div class="group-label">ブースト倍率（デバッグ）</div>
    <div class="chips"><input type="number" id="boost-mult-input" class="num-input" value="30" step="0.5" min="0.5" max="50"></div>
    <button id="battle-btn" class="btn">バトル開始</button>
  </div>
</div>

<!-- バトル -->
<div id="screen-battle" class="screen">
  <div id="hud">
    <div class="hud-row"><span class="hname" id="name-player">あなた</span><div class="bar"><div class="fill" id="spin-player"></div></div></div>
    <div class="hud-row" id="boost-row" style="display:none"><span class="hname">ブースト</span><div id="boost-gauge-wrap"><div id="boost-gauge-fill"></div></div></div>
    <div class="hud-row"><span class="hname" id="name-cpu">CPU</span><div class="bar"><div class="fill" id="spin-cpu"></div></div></div>
    <div class="hud-row" id="boost-row-cpu" style="display:none"><span class="hname">ブースト</span><div id="boost-gauge-wrap-cpu"><div id="boost-gauge-fill-cpu"></div></div></div>
  </div>
  <div id="power-wrap">
    <div id="timing-wrap"><div id="timing-ring"></div><div id="clash-msg"></div></div>
    <div id="battle-msg"></div>
    <div id="power-bar-wrap"><div id="power-fill"></div></div>
    <button id="launch-btn" class="btn">長押しでパワー</button>
    <button id="demo-exit-btn" class="btn sub" style="display:none">タイトルへ</button>
  </div>
</div>

<!-- 結果 -->
<div id="screen-result" class="screen">
  <div id="result-card">
    <p id="result-title">勝ち！</p>
    <p id="result-reason"></p>
    <div class="btns" id="result-btns">
      <button id="rematch-btn" class="btn">もう一度</button>
      <button id="rebuild-btn" class="btn sub">組み立てに戻る</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= パーツ定義 =================
   st: こうげき(atk) / たいりょく(hp) / スピード(spd) への寄与。
   パンツはどれも合計12、本体はどれも合計18で、同種パーツに優劣はなく配分だけが違う。
   オプションは±0の付け替え（shift）：指定ステータスへ点を移動するだけで合計は変わらない。
   よって、どの組み合わせでも3ステータスの合計は常に30になる。
   つまようじ（軸）は全コマ共通の見た目として刺さったまま残り、パーツとしては選ばない */
/* パンツ（帽子＝殻斗）。pts は「被せ位置での実の半径＝1」を基準にした回転体プロファイル
   （yは被せ位置からの高さ）。kind: 'scales'=ウロコ模様 / 'shaggy'=棘・モジャモジャの分厚い帽子 /
   'petal'=花びらのように下に広がる / 'stripes'=縦じま模様。topY はプロファイルの最高点 */
const PANTS = {
  uroko:      { name:'ウロコ',       st:{ atk:4, hp:4, spd:4 }, col:0x7a5230, rough:0.95, kind:'scales',  topY:0.45,
    pts:[[1.00,0.00],[1.10,0.05],[1.14,0.13],[1.06,0.24],[0.88,0.33],[0.60,0.40],[0.28,0.44],[0.001,0.45]] },
  togetoge:   { name:'トゲトゲ',     st:{ atk:8, hp:2, spd:2 }, col:0x5d4020, rough:1.00, kind:'shaggy',  topY:0.48,
    pts:[[1.02,0.00],[1.12,0.06],[1.14,0.16],[1.04,0.28],[0.84,0.38],[0.55,0.44],[0.24,0.47],[0.001,0.48]] },
  tulip:      { name:'チューリップ', st:{ atk:2, hp:8, spd:2 }, col:0x96502a, rough:0.80, kind:'petal',   topY:0.42,
    pts:[[1.18,-0.20],[1.10,-0.08],[1.00,0.00],[1.02,0.10],[0.94,0.22],[0.74,0.32],[0.45,0.39],[0.001,0.42]] },
  shimashima: { name:'シマシマ',     st:{ atk:2, hp:2, spd:8 }, col:0x6e4f2c, rough:0.90, kind:'stripes', topY:0.43,
    pts:[[1.00,0.00],[1.08,0.05],[1.10,0.14],[1.00,0.25],[0.82,0.34],[0.55,0.40],[0.001,0.43]] },
};
/* 本体は帽子なしの「実」だけの形。nutPts は単位空間（高さ1.40基準）の回転体プロファイル。
   capY/capR: パンツを被せる高さと、その高さでの実の半径。パンツはこの半径に合わせて付くので、
   どのパンツ×本体の組み合わせでも帽子が実の幅に合い、見た目が破綻しない */
const BODIES = {
  maru: { name:'丸', sx:1.00, sy:1.00, mass:1.00, st:{ atk:6, hp:6, spd:6 },
    nutCol:0xb57a38, nutRough:0.60, capY:0.88, capR:0.97,
    nutPts:[[0.001,0.00],[0.30,0.02],[0.55,0.08],[0.78,0.22],[0.92,0.42],[0.99,0.62],[1.00,0.78],[0.94,0.92],[0.82,1.00]] },
  futo: { name:'太', sx:1.14, sy:0.78, mass:1.15, st:{ atk:5, hp:8, spd:5 },
    nutCol:0x9e6527, nutRough:0.70, capY:0.76, capR:0.95,
    nutPts:[[0.001,0.00],[0.34,0.02],[0.62,0.07],[0.85,0.18],[0.97,0.36],[1.00,0.55],[0.97,0.72],[0.86,0.84],[0.70,0.90]] },
  hoso: { name:'細', sx:0.80, sy:1.32, mass:0.80, st:{ atk:3, hp:3, spd:12 },
    nutCol:0xc99047, nutRough:0.25, capY:1.02, capR:0.92,
    nutPts:[[0.001,0.00],[0.22,0.03],[0.45,0.10],[0.68,0.24],[0.84,0.44],[0.93,0.66],[0.95,0.86],[0.90,1.02],[0.78,1.12],[0.60,1.17]] },
  kuri: { name:'栗', sx:1.02, sy:0.95, mass:1.05, st:{ atk:8, hp:4, spd:6 },
    nutCol:0x6e3f1d, huskCol:0x86662c, nutRough:0.35, capY:1.14, capR:0.84, iga:true },
};
const OPTIONS = {
  none:  { name:'なし',   mass:1.00, shift:null },
  toge:  { name:'トゲ',   mass:1.05, shift:{ to:'atk', amount:9 } },
  ring:  { name:'リング', mass:1.10, shift:{ to:'spd', amount:5 } },
  omori: { name:'おもり', mass:1.35, shift:{ to:'hp',  amount:9 } },
};
const STAT_KEYS = [
  ['atk','こうげき'], ['hp','たいりょく'], ['spd','スピード'],
];

function calcStats(sel){
  const a = PANTS[sel.pants], b = BODIES[sel.body], o = OPTIONS[sel.option];
  const st = {};
  for (const [k] of STAT_KEYS){
    st[k] = a.st[k] + b.st[k];   // パンツ＋本体の素の合計（常に30）
  }
  // オプションの付け替え：他の2ステータスから半分ずつを目安に、ある分だけ取る。
  // 片方が足りなければもう片方から取るので、合計は変わらずマイナスにもならない。
  // ただし各ステータスに最低1は残す：移動元からは（現在の値 − 1）までしか取らない。
  // 両方の移動元を合わせても足りない場合は、取れる分だけ移動する（合計は保たれる）
  if (o.shift){
    const { to, amount } = o.shift;
    const others = STAT_KEYS.map(([k]) => k).filter(k => k !== to);
    const availA = Math.max(0, st[others[0]] - 1);
    const availB = Math.max(0, st[others[1]] - 1);
    let takeA = Math.min(availA, Math.ceil(amount / 2));
    let takeB = Math.min(availB, amount - takeA);
    takeA = Math.min(availA, amount - takeB);   // Bが足りなければAから追加で取る
    st[others[0]] -= takeA;
    st[others[1]] -= takeB;
    st[to] += takeA + takeB;
  }
  return {
    st,
    atkMult: 0.45 + 0.05 * st.atk,    // 衝突で与えるダメージの倍率
    maxSpin: 30 + 6 * st.hp,          // 最大体力（スピンの上限）
    spdMult: 0.70 + 0.032 * st.spd,   // そのコマ個別の速度倍率
    mass: b.mass * o.mass,        // 軸（つまようじ）は全コマ共通なので質量は本体×オプションのみ
    radius: b.sx,                 // 基準半径1 × 本体の横スケール
  };
}

/* ================= コマの3Dモデル ================= */
const SHAFT_COL = 0xe8cf9f;

/* 種ごとの色をサイドに合わせて調整する：プレイヤーは種本来の色、
   CPUは緑寄りに寄せて見分けがつくようにする（種同士の明暗関係は保たれる） */
function sideColor(hex, side){
  const c = new THREE.Color(hex);
  if (side === 'cpu'){ c.r *= 0.70; c.g *= 1.04; c.b *= 0.52; }
  return c;
}

/* 決定的な乱数（テクスチャと形のノイズ生成用。毎回同じ結果になる） */
function makeRng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hexRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
/* カラー用Canvasテクスチャの共通生成（sRGB・異方性フィルタ付き） */
function makeCanvasTex(w, h, draw){
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* ウロコ模様のテクスチャ（Canvasで生成、使い回す）。
   鱗1枚ごとにグラデーション（下端が暗い＝下の鱗に落ちる陰影）とハイライトを描く */
let _scaleTex = null;
function scaleTexture(){
  if (_scaleTex) return _scaleTex;
  const rng = makeRng(7101);
  _scaleTex = makeCanvasTex(512, 512, (g) => {
    g.fillStyle = '#cfcfcf'; g.fillRect(0, 0, 512, 512);
    const rows = 10, cols = 10, w = 512 / cols, h = 512 / rows;
    for (let r = 0; r < rows; r++){
      for (let c = -1; c < cols; c++){
        const x = c * w + (r % 2 ? w / 2 : 0), y = r * h;
        const j = 0.92 + rng() * 0.13;            // 鱗ごとの明るさのばらつき
        const top = Math.round(248 * j), mid = Math.round(226 * j), bot = Math.round(176 * j);
        const grad = g.createLinearGradient(0, y - h * 0.35, 0, y + h * 0.95);
        grad.addColorStop(0, `rgb(${top},${top},${top})`);
        grad.addColorStop(0.55, `rgb(${mid},${mid},${mid})`);
        grad.addColorStop(1, `rgb(${bot},${bot},${bot})`);
        g.beginPath();
        g.arc(x, y + h * 0.15, w * 0.62, 0, Math.PI, false);
        g.closePath();
        g.fillStyle = grad; g.fill();
        g.strokeStyle = 'rgba(70,70,70,0.55)'; g.lineWidth = 3; g.stroke();
        g.beginPath();   // 上部のハイライト
        g.arc(x, y + h * 0.15, w * 0.44, Math.PI * 1.15, Math.PI * 1.85);
        g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 3; g.stroke();
      }
    }
  });
  _scaleTex.repeat.set(3, 2);
  return _scaleTex;
}

/* 縦じま模様のテクスチャ（Canvasで生成、パラメータごとに使い回す）。
   回転体のU方向＝周方向なので、テクスチャの縦帯が帽子の縦じまになる。
   縞ごとに幅と明るさをばらつかせ、帯の中央が明るく端が暗い濃淡を付ける */
const _stripeTexCache = {};
function stripeTexture(bands, light, dark){
  const key = bands + '/' + light + '/' + dark;
  if (_stripeTexCache[key]) return _stripeTexCache[key];
  const rng = makeRng(9000 + bands);
  const L = hexRgb(light), D = hexRgb(dark);
  const widths = [];
  let sum = 0;
  for (let i = 0; i < bands; i++){ const w = 0.82 + rng() * 0.36; widths.push(w); sum += w; }
  const tex = makeCanvasTex(512, 256, (g) => {
    g.fillStyle = dark; g.fillRect(0, 0, 512, 256);
    let x = 0;
    for (let i = 0; i < bands; i++){
      const w = widths[i] / sum * 512;
      const c = i % 2 === 0 ? L : D;
      const j = 0.94 + rng() * 0.10;
      const ch = (v, f) => Math.max(0, Math.min(255, Math.round(v * j * f)));
      const grad = g.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, `rgb(${ch(c[0], 0.76)},${ch(c[1], 0.76)},${ch(c[2], 0.76)})`);
      grad.addColorStop(0.5, `rgb(${ch(c[0], 1)},${ch(c[1], 1)},${ch(c[2], 1)})`);
      grad.addColorStop(1, `rgb(${ch(c[0], 0.76)},${ch(c[1], 0.76)},${ch(c[2], 0.76)})`);
      g.fillStyle = grad;
      g.fillRect(x, 0, w + 1, 256);
      x += w;
    }
    // 細かいムラと斑点で均一さを崩す
    for (let i = 0; i < 2600; i++){
      const a = rng() * 0.07;
      g.fillStyle = rng() < 0.5 ? `rgba(60,45,25,${a})` : `rgba(255,255,255,${a})`;
      g.fillRect(rng() * 512, rng() * 256, 1.6, 1.6 + rng() * 5);
    }
  });
  _stripeTexCache[key] = tex;
  return tex;
}

/* チューリップ用：花びらの継ぎ目とグラデーションのテクスチャ。
   回転体のvは裾（最初の点）が0側＝キャンバス下側なので、裾ほど色を深くする */
let _petalTex = null;
function petalTexture(){
  if (_petalTex) return _petalTex;
  const rng = makeRng(5501);
  _petalTex = makeCanvasTex(512, 256, (g) => {
    const petals = 6, w = 512 / petals;
    for (let i = 0; i < petals; i++){
      const x = i * w, j = 0.95 + rng() * 0.09;
      const c = v => Math.round(v * j);
      const grad = g.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, `rgb(${c(196)},${c(196)},${c(196)})`);
      grad.addColorStop(0.5, `rgb(${c(246)},${c(246)},${c(246)})`);
      grad.addColorStop(1, `rgb(${c(196)},${c(196)},${c(196)})`);
      g.fillStyle = grad;
      g.fillRect(x, 0, w + 1, 256);
    }
    const vg = g.createLinearGradient(0, 0, 0, 256);
    vg.addColorStop(0, 'rgba(255,255,255,0.10)');
    vg.addColorStop(0.55, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(60,35,15,0.22)');
    g.fillStyle = vg; g.fillRect(0, 0, 512, 256);
    for (let i = 0; i < petals; i++){   // 継ぎ目：暗い線＋隣の細いハイライト
      const x = i * w;
      g.fillStyle = 'rgba(80,55,30,0.5)'; g.fillRect(x - 1.5, 0, 3, 256);
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x + 1.5, 0, 2, 256);
    }
    for (let i = 0; i < 380; i++){      // 花びら内の細い縦筋
      g.fillStyle = `rgba(90,60,30,${0.03 + rng() * 0.05})`;
      g.fillRect(rng() * 512, rng() * 80, 1.2, 120 + rng() * 136);
    }
  });
  return _petalTex;
}

/* 実のテクスチャ：縦筋・斑点・色ムラを描く。本体種ごとに描き込みの性格を変えて
   色味の個性を強める（テクスチャは白〜灰の乗算用で、色そのものはマテリアル色が決める） */
const NUT_TEX_PARAMS = {
  maru: { base:0.90, streaks:110, streakAlpha:0.15, speckles:900,  speckleAlpha:0.18, mottles:26, mottleAlpha:0.09, seed:1101 },
  futo: { base:0.88, streaks:90,  streakAlpha:0.19, speckles:1250, speckleAlpha:0.22, mottles:42, mottleAlpha:0.13, seed:2202 },
  hoso: { base:0.93, streaks:175, streakAlpha:0.09, speckles:380,  speckleAlpha:0.11, mottles:14, mottleAlpha:0.05, seed:3303 },
  kuri: { base:0.86, streaks:80,  streakAlpha:0.21, speckles:1450, speckleAlpha:0.26, mottles:46, mottleAlpha:0.15, seed:4404 },
};
const _nutTexCache = {};
function nutTexture(bodyKey){
  if (_nutTexCache[bodyKey]) return _nutTexCache[bodyKey];
  const P = NUT_TEX_PARAMS[bodyKey] || NUT_TEX_PARAMS.maru;
  const rng = makeRng(P.seed);
  const tex = makeCanvasTex(512, 512, (g) => {
    const base = Math.round(P.base * 255);
    g.fillStyle = `rgb(${base},${base},${base})`;
    g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < P.mottles; i++){   // 色ムラ：大きな柔らかい濃淡
      const x = rng() * 512, y = rng() * 512, r = 50 + rng() * 130;
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, rng() < 0.55 ? `rgba(50,32,14,${P.mottleAlpha})` : `rgba(255,246,230,${P.mottleAlpha})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let i = 0; i < P.streaks; i++){   // 縦筋：繊維に沿った細い線（少しうねらせる）
      const x0 = rng() * 512, wob = (rng() - 0.5) * 14, ph = rng() * Math.PI * 2;
      const a = P.streakAlpha * (0.5 + rng() * 0.8);
      g.strokeStyle = rng() < 0.6 ? `rgba(52,34,14,${a})` : `rgba(255,248,235,${a})`;
      g.lineWidth = 0.8 + rng() * 2.0;
      g.beginPath();
      for (let y = 0; y <= 512; y += 32){
        const x = x0 + Math.sin(ph + y * 0.012) * wob;
        if (y === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }
    for (let i = 0; i < P.speckles; i++){ // 斑点
      const a = P.speckleAlpha * (0.4 + rng() * 0.8);
      g.fillStyle = rng() < 0.62 ? `rgba(48,30,12,${a})` : `rgba(255,244,225,${a})`;
      const r = 0.7 + rng() * 1.9;
      g.beginPath();
      g.ellipse(rng() * 512, rng() * 512, r, r * (0.6 + rng() * 0.7), rng() * Math.PI, 0, Math.PI * 2);
      g.fill();
    }
  });
  _nutTexCache[bodyKey] = tex;
  return tex;
}

/* トゲトゲ用：粗さのムラ（roughnessMap／bumpMapに使うグレースケールの斑模様）。
   カラー情報ではないので sRGB にはしない */
let _noiseTex = null;
function noiseTexture(){
  if (_noiseTex) return _noiseTex;
  const rng = makeRng(8808);
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#e2e2e2'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++){
    const x = rng() * 256, y = rng() * 256, r = 4 + rng() * 22;
    const v = 120 + Math.round(rng() * 135);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${v},${v},${v},0.5)`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  _noiseTex = tex;
  return tex;
}

function latheFrom(pts, mat){
  const v = pts.map(p => new THREE.Vector2(p[0], p[1]));
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(v, 28), mat);
  mesh.castShadow = true;
  return mesh;
}

/* 実の形に低周波で小さな歪みを加えて、完全な回転体から外す（有機感）。
   シードは本体種で固定するので、同じ本体なら自分・CPUで同じ形になる。
   変位は半径の最大2%弱に抑え、衝突判定（半径パラメータ側）には影響しない */
function organicNoise(geometry, seedKey, amp){
  let hsh = 2166136261;
  for (let i = 0; i < seedKey.length; i++){ hsh ^= seedKey.charCodeAt(i); hsh = Math.imul(hsh, 16777619); }
  const rng = makeRng(hsh >>> 0);
  const p1 = rng() * Math.PI * 2, p2 = rng() * Math.PI * 2, p3 = rng() * Math.PI * 2;
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (Math.hypot(x, z) < 1e-4) continue;   // 軸上の点は動かさない
    const th = Math.atan2(z, x);
    const n = 0.55 * Math.sin(3 * th + p1 + 2.0 * y)
            + 0.30 * Math.sin(5 * th - p2 + 4.2 * y)
            + 0.45 * Math.sin(2 * th + p3 - 1.6 * y);
    const s = 1 + amp * n;
    pos.setX(i, x * s);
    pos.setZ(i, z * s);
  }
  pos.needsUpdate = true;
}

/* 原点＝軸の先端（下端）。spinGroup が回転し、root が位置と傾きを持つ */
function buildTopMesh(sel, side){
  const pants = PANTS[sel.pants], body = BODIES[sel.body], opt = sel.option;
  const root = new THREE.Group();
  const spinG = new THREE.Group();
  root.add(spinG);

  // 本体のマテリアルは全て blink（瀕死の赤点滅）対象として登録する
  const blink = [];
  const stdMat = (hex, rough, extra = {}) => {
    const m = new THREE.MeshStandardMaterial({ color: sideColor(hex, side), roughness: rough, envMapIntensity: 0.5, ...extra });
    blink.push({ mat: m, base: m.color.clone() });
    return m;
  };
  // 実の素材：プロシージャルテクスチャ（縦筋・斑点・色ムラ）を色と凹凸に使う。
  // ツヤの強い実（粗さ0.4以下）はクリアコート付きの物理マテリアルにして、
  // 環境の映り込みで光沢が映えるようにする。どちらも blink 登録は従来どおり
  const nutTex = nutTexture(sel.body);
  let nutMat;
  if (body.nutRough <= 0.4){
    nutMat = new THREE.MeshPhysicalMaterial({
      color: sideColor(body.nutCol, side), roughness: body.nutRough,
      map: nutTex, bumpMap: nutTex, bumpScale: 0.35,
      clearcoat: 0.55, clearcoatRoughness: 0.35, envMapIntensity: 0.9,
    });
  } else {
    nutMat = new THREE.MeshStandardMaterial({
      color: sideColor(body.nutCol, side), roughness: body.nutRough,
      map: nutTex, bumpMap: nutTex, bumpScale: 0.35, envMapIntensity: 0.55,
    });
  }
  blink.push({ mat: nutMat, base: nutMat.color.clone() });
  const capMat = stdMat(pants.col, pants.rough);
  const below = 0.5;   // 本体より下に出る軸の長さ（軸は全コマ共通）

  // 本体（実）：形ごとに輪郭を変える。パンツ（帽子）はこの上に別途被せる
  const bodyG = new THREE.Group();
  bodyG.position.y = below;
  bodyG.scale.set(body.sx, body.sy, body.sx);

  let nutTopY = 0;   // 実（栗はイガ）の一番高い点。軸の長さの計算に使う
  if (body.iga){
    // 栗：下部に実が少し覗き、大部分は棘だらけのイガ（殻）に覆われる
    const peek = latheFrom([
      [0.001,0.00],[0.30,0.02],[0.52,0.08],[0.66,0.18],[0.70,0.30],
    ], nutMat);
    organicNoise(peek.geometry, sel.body, 0.012);
    const huskMat = stdMat(body.huskCol, 0.95);
    const husk = latheFrom([
      [0.001,0.16],[0.40,0.20],[0.68,0.30],[0.88,0.48],[0.98,0.70],
      [0.99,0.90],[0.90,1.08],[0.72,1.22],[0.45,1.33],[0.001,1.38],
    ], huskMat);
    bodyG.add(peek, husk);
    // 棘：フィボナッチ球で均等配置（InstancedMeshで1オブジェクトにまとめる）
    const spikeMat = stdMat(0x74551f, 1.0);
    const N = 120;
    const spikes = new THREE.InstancedMesh(new THREE.ConeGeometry(0.035, 0.22, 6), spikeMat, N);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
    const up = new THREE.Vector3(0, 1, 0), center = new THREE.Vector3(0, 0.78, 0);
    let placed = 0;
    for (let i = 0; i < N * 3 && placed < N; i++){
      const yy = 1 - (i / (N * 3 - 1)) * 2;        // 1 → -1
      if (yy < -0.45 || yy > 0.10) continue;       // 下部（実が覗く部分）と上部（パンツを被せる部分）には生やさない
      const rr = Math.sqrt(Math.max(0, 1 - yy * yy));
      const th = i * 2.399963;                     // 黄金角
      const dir = new THREE.Vector3(Math.cos(th) * rr, yy, Math.sin(th) * rr);
      const pos = new THREE.Vector3(dir.x * 0.97, center.y + dir.y * 0.60, dir.z * 0.97);
      q.setFromUnitVectors(up, pos.clone().sub(center).normalize());
      m4.compose(pos, q, new THREE.Vector3(1, 1, 1));
      spikes.setMatrixAt(placed++, m4);
    }
    spikes.count = placed;
    spikes.castShadow = true;
    bodyG.add(spikes);
    nutTopY = 1.38;
  } else {
    const nut = latheFrom(body.nutPts, nutMat);
    organicNoise(nut.geometry, sel.body, 0.014);
    bodyG.add(nut);
    nutTopY = Math.max(...body.nutPts.map(p => p[1]));
  }

  // パンツ（帽子）：実の幅（capR）に合わせて被せるので、どの組み合わせでも幅が合う
  const capG = new THREE.Group();
  capG.position.y = body.capY;
  capG.scale.set(body.capR, 1, body.capR);
  capG.add(latheFrom(pants.pts, capMat));
  if (pants.kind === 'scales'){
    // ウロコ：帽子にウロコ模様（鱗1枚ごとの陰影＋凹凸）
    const tex = scaleTexture();
    capMat.map = tex;
    capMat.bumpMap = tex;
    capMat.bumpScale = 0.25;
  } else if (pants.kind === 'stripes'){
    // シマシマ：縦じま模様（縞の濃淡と乱れ＋凹凸）
    const tex = stripeTexture(18, '#efefef', '#bcbcbc');
    capMat.map = tex;
    capMat.bumpMap = tex;
    capMat.bumpScale = 0.15;
  } else if (pants.kind === 'petal'){
    // チューリップ：花びらの継ぎ目とグラデーション
    const tex = petalTexture();
    capMat.map = tex;
    capMat.bumpMap = tex;
    capMat.bumpScale = 0.1;
  } else if (pants.kind === 'shaggy'){
    // トゲトゲ：粗さのムラ（斑模様を roughness と凹凸に使う）
    const ntex = noiseTexture();
    capMat.roughnessMap = ntex;
    capMat.bumpMap = ntex;
    capMat.bumpScale = 0.3;
    // 分厚い帽子の縁に細かい突起（モジャモジャ）を多数付ける
    const fringeMat = stdMat(0x4e3319, 1.0);
    const M = 30;
    const fringe = new THREE.InstancedMesh(new THREE.ConeGeometry(0.028, 0.20, 5), fringeMat, M);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < M; i++){
      const th = (i / M) * Math.PI * 2 + (i % 2) * 0.1;
      const dir = new THREE.Vector3(Math.cos(th) * 0.75, -0.66, Math.sin(th) * 0.75).normalize();
      const pos = new THREE.Vector3(Math.cos(th) * 1.06, 0.04, Math.sin(th) * 1.06);
      q.setFromUnitVectors(up, dir);
      m4.compose(pos, q, new THREE.Vector3(1, 1, 1));
      fringe.setMatrixAt(i, m4);
    }
    fringe.castShadow = true;
    capG.add(fringe);
  }
  bodyG.add(capG);

  // へた（帽子の柄）：パンツの天辺に付ける
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.065, 0.24, 8), capMat);
  stem.position.set(0.03, body.capY + pants.topY + 0.05, 0);
  stem.rotation.z = 0.18; stem.castShadow = true;
  bodyG.add(stem);

  // オプションパーツ（本体グループ内なので形に追随する）
  if (opt === 'toge'){
    const spikeMat = new THREE.MeshStandardMaterial({ color:0x6b6b6b, roughness:0.4, metalness:0.7 });
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < 6; i++){
      const th = (i / 6) * Math.PI * 2;
      const dir = new THREE.Vector3(Math.cos(th), 0, Math.sin(th));
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.34, 10), spikeMat);
      cone.position.set(dir.x * 1.05, 0.62, dir.z * 1.05);
      cone.quaternion.setFromUnitVectors(up, dir);
      cone.castShadow = true;
      bodyG.add(cone);
    }
  } else if (opt === 'ring'){
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.05, 0.075, 12, 36),
      new THREE.MeshStandardMaterial({ color:0xc9a227, roughness:0.35, metalness:0.8 }));
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.62; ring.castShadow = true;
    bodyG.add(ring);
  } else if (opt === 'omori'){
    const band = new THREE.Mesh(
      new THREE.CylinderGeometry(1.07, 1.07, 0.30, 28, 1, true),
      new THREE.MeshStandardMaterial({ color:0x5a4a3a, roughness:0.5, metalness:0.6, side:THREE.DoubleSide }));
    band.position.y = 0.42; band.castShadow = true;
    bodyG.add(band);
  }
  spinG.add(bodyG);

  // 軸（つまようじ）: 先端から本体を貫いて上へ（全コマ共通の見た目）
  const bodyH = Math.max(nutTopY, body.capY + pants.topY) * body.sy;
  const above = 0.30;
  const shaftLen = below + bodyH + above;
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.04, shaftLen, 10),
    new THREE.MeshStandardMaterial({ color:SHAFT_COL, roughness:0.8 }));
  shaft.position.y = shaftLen / 2;
  shaft.castShadow = true;
  spinG.add(shaft);

  // 瀕死サイン用：本体の全マテリアル（実・帽子・イガの棘・トゲトゲの縁など）と元の色を覚えておく
  root.userData.blink = blink;
  root.userData.spinG = spinG;
  return root;
}

function disposeTop(root){
  root.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  });
}

/* ================= レンダラーとシーン ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0xf7ead2, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.getElementById('stage').appendChild(renderer.domElement);

function addLights(scene, shadowRange){
  // 環境光（IBL）が下地の明るさを担うので、半球光は控えめにして二重に明るくしない
  scene.add(new THREE.HemisphereLight(0xfff4dd, 0x9a7a4f, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(5, 10, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);   // モバイル負荷に配慮したサイズ
  sun.shadow.camera.left = -shadowRange; sun.shadow.camera.right = shadowRange;
  sun.shadow.camera.top = shadowRange;   sun.shadow.camera.bottom = -shadowRange;
  sun.shadow.camera.near = 2;

/* --- 火花パーティクル（プール管理、加算ブレンドで寿命とともに暗く消える） --- */
const SPARK_MAX = 420;
const sparkPos  = new Float32Array(SPARK_MAX * 3);
const sparkCol  = new Float32Array(SPARK_MAX * 3);
const sparkVel  = new Float32Array(SPARK_MAX * 3);
const sparkBase = new Float32Array(SPARK_MAX * 3);   // 元の色（フェード計算用）
const sparkLife = new Float32Array(SPARK_MAX);
const sparkMaxLife = new Float32Array(SPARK_MAX);
for (let i = 0; i < SPARK_MAX; i++) sparkPos[i * 3 + 1] = -999;
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

let sparkCursor = 0;

function spawnSparks(x, y, z, count, speed, just){
  for (let n = 0; n < count; n++){
    const i = sparkCursor; sparkCursor = (sparkCursor + 1) % SPARK_MAX;
    const th = Math.random() * Math.PI * 2;
    const sp = speed * (0.35 + Math.random() * 0.85);
    sparkPos[i * 3] = x; sparkPos[i * 3 + 1] = y; sparkPos[i * 3 + 2] = z;
    sparkVel[i * 3]     = Math.cos(th) * sp;
    sparkVel[i * 3 + 1] = (0.25 + Math.random() * 0.9) * sp;   // 上向き成分を持たせる
    sparkVel[i * 3 + 2] = Math.sin(th) * sp;
    sparkMaxLife[i] = sparkLife[i] = 0.3 + Math.random() * 0.35;
    // ジャスト時は明るい金色、通常は橙色の火花
    const r = 1.0, g = just ? 0.88 : 0.62, b = just ? 0.45 : 0.18;
    sparkBase[i * 3] = r; sparkBase[i * 3 + 1] = g; sparkBase[i * 3 + 2] = b;
    sparkCol[i * 3] = r;  sparkCol[i * 3 + 1] = g;  sparkCol[i * 3 + 2] = b;
  }
}

function updateSparks(dt){
  for (let i = 0; i < SPARK_MAX; i++){
    if (sparkLife[i] <= 0) continue;
    sparkLife[i] -= dt;
    if (sparkLife[i] <= 0){
      sparkPos[i * 3 + 1] = -999;
      sparkCol[i * 3] = sparkCol[i * 3 + 1] = sparkCol[i * 3 + 2] = 0;
      continue;
    }
    sparkVel[i * 3 + 1] -= 7.5 * dt;   // 重力
    sparkPos[i * 3]     += sparkVel[i * 3] * dt;
    sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
    sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
    const k = sparkLife[i] / sparkMaxLife[i];
    sparkCol[i * 3]     = sparkBase[i * 3] * k;
    sparkCol[i * 3 + 1] = sparkBase[i * 3 + 1] * k;
    sparkCol[i * 3 + 2] = sparkBase[i * 3 + 2] * k;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.color.needsUpdate = true;
}

/* --- 衝撃バースト（カメラ向きスプライト。色でジャストの勝敗を伝える） ---
   テクスチャは Canvas でプロシージャル生成した白基調の放射バースト。
   SpriteMaterial の color で着色するので、色違いは同じテクスチャを使い回す。
   青＝プレイヤーのジャスト成功／赤＝CPUのジャスト成功（プレイヤー失敗）／
   黄＝相殺（派手さ控えめ）。ブーストアタック成功時は特大＋二重＋リング追加 */
function makeBurstTexture(){
  const S = 256;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const cx = S / 2, cy = S / 2;
  // 中心の閃光（放射グラデーション）
  const grad = g.createRadialGradient(cx, cy, 0, cx, cy, S / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.16, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.42, 'rgba(255,255,255,0.28)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  // 放射状の streaks（細長い光の筋）
  g.globalCompositeOperation = 'lighter';
  const N = 30;
  for (let i = 0; i < N; i++){
    const th = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
    const len = S * 0.5 * (0.4 + Math.random() * 0.6);
    const lg = g.createLinearGradient(cx, cy, cx + Math.cos(th) * len, cy + Math.sin(th) * len);
    lg.addColorStop(0, 'rgba(255,255,255,0.95)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.strokeStyle = lg;
    g.lineWidth = 2 + Math.random() * 5;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(cx, cy);
    g.lineTo(cx + Math.cos(th) * len, cy + Math.sin(th) * len);
    g.stroke();
  }
  return new THREE.CanvasTexture(cv);
}

function spawnBurst(x, z, colorHex, opts = {}){

}
function updateBursts(dt){
  for (const b of burstPool){
    if (!b.active) continue;
    b.t += dt;
    if (b.t < 0) continue;   // 遅延待ち（二重バーストの2発目）
    b.sp.visible = true;
    const k = b.t / b.dur;
    if (k >= 1){ b.active = false; b.sp.visible = false; continue; }
    const e = 1 - (1 - k) * (1 - k);   // 最初速く広がる
    const s = b.from + (b.to - b.from) * e;
    b.sp.scale.set(s, s, 1);
    b.mat.opacity = b.maxOp * Math.pow(1 - k, 1.4);
  }
}

/* --- ブースト中の渦パーティクル（軸の接地点から渦巻いて上昇し、コマを包む） ---

const VORTEX_MAX = 110;
function makeVortex(r, g, b){
  const pos = new Float32Array(VORTEX_MAX * 3);

  const dat = [];
  for (let i = 0; i < VORTEX_MAX; i++){
    pos[i * 3 + 1] = -999;
    dat.push({ ang: 0, rad: 0.2, h: 0, va: 10, vh: 2, life: 0, maxLife: 1 });
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const points = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.13, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  points.frustumCulled = false;
  battleScene.add(points);
  return { pos, col, dat, geo, cursor: 0, acc: 0, rgb: [r, g, b] };
}

function updateVortexSys(sys, f, mult, dt){

    sys.acc += dt * 55;   // 毎秒約55個スポーン（プール110個・寿命0.6〜0.9秒で常時60個前後）
    while (sys.acc >= 1){

      d.ang = Math.random() * Math.PI * 2;
      d.rad = 0.14 + Math.random() * 0.28;
      d.h = 0;
      d.va = 9 + Math.random() * 7;      // 角速度（rad/s）。接地点で高速回転
      d.vh = 1.6 + Math.random() * 1.0;  // 上昇速度。寿命と合わせて高さ1.2前後まで届く
      d.maxLife = d.life = 0.6 + Math.random() * 0.3;
    }
  }
  const bx = f ? f.x : 0, bz = f ? f.z : 0;
  const by = f ? bowlY(Math.min(Math.hypot(bx, bz), ARENA_R + 0.6)) : 0;
  for (let i = 0; i < VORTEX_MAX; i++){
    const d = sys.dat[i];
    if (d.life <= 0) continue;
    d.life -= dt;
    if (d.life <= 0){
      sys.pos[i * 3 + 1] = -999;
      sys.col[i * 3] = sys.col[i * 3 + 1] = sys.col[i * 3 + 2] = 0;
      continue;
    }
    d.ang += d.va * dt;
    d.h += d.vh * dt;
    const rr = d.rad * (1 + d.h * 0.5);   // 上に行くほど少し広がる
    sys.pos[i * 3]     = bx + Math.cos(d.ang) * rr;
    sys.pos[i * 3 + 1] = by + 0.05 + d.h;
    sys.pos[i * 3 + 2] = bz + Math.sin(d.ang) * rr;
    const k = d.life / d.maxLife;
    sys.col[i * 3]     = sys.rgb[0] * k;
    sys.col[i * 3 + 1] = sys.rgb[1] * k;
    sys.col[i * 3 + 2] = sys.rgb[2] * k;
  }
  sys.geo.attributes.position.needsUpdate = true;
  sys.geo.attributes.color.needsUpdate = true;
}

function updateVortex(dt){
  if (!fighters) return;
  updateVortexSys(vortexP, fighters.player, currentBoostMult(), dt);
  updateVortexSys(vortexC, fighters.cpu, cpuBoostMult(), dt);
}

/* --- 画面シェイクとヒットストップ --- */
let shakeAmp = 0, shakeT = 0, shakeDur = 0.2;
function addShake(amp, dur){
  if (shakeT <= 0 || amp >= shakeAmp) shakeAmp = amp;
  shakeT = shakeDur = Math.max(shakeT, dur);
}
let hitstop = 0;   // 残り秒（実時間）。この間バトルの時間経過をほぼ止める
function addHitstop(sec){ hitstop = Math.max(hitstop, sec); }

/* --- 効果音（WebAudioで合成。ユーザー操作を起点に開始する） --- */
let audioCtx = null, noiseBuf = null;
function ensureAudio(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.1), audioCtx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playHit(strength, just){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  const vol = Math.min(0.9, 0.22 + strength * 0.55) * (just ? 1.15 : 1);
  // 芯の打撃音：サイン波が低く落ちる
  const osc = audioCtx.createOscillator(), og = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(just ? 300 : 190, t);
  osc.frequency.exponentialRampToValueAtTime(55, t + 0.1);
  og.gain.setValueAtTime(vol, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.14);
  // 金属的なアタック：バンドパスを通したノイズバースト
  const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = just ? 2800 : 1700; bp.Q.value = 0.7;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(vol * 0.8, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  src.connect(bp); bp.connect(ng); ng.connect(audioCtx.destination);
  src.start(t); src.stop(t + 0.09);
  if (just){
    // ジャスト時は明るい上音を重ねる
    const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(740, t);
    o2.frequency.exponentialRampToValueAtTime(1180, t + 0.08);
    g2.gain.setValueAtTime(vol * 0.35, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(t); o2.stop(t + 0.13);
  }
}

function triggerClashFX(x, z, strength, just){
  const d = Math.hypot(x, z);

function statIcons(v){
  const groups = [];

  const fives = Math.floor((v % 10) / 5);
  const ones  = v % 5;
  if (tens)  groups.push(`<span class="ic s10">${'★'.repeat(tens)}</span>`);

/* 時計の文字盤上の位置（h時方向・半径r）の座標。
   画面との対応：12時＝奥（-Z）、3時＝右（+X）、6時＝手前（+Z）、9時＝左（-X） */
function clockPos(h, r){
  const th = h * Math.PI / 6;
  return { x: Math.sin(th) * r, z: -Math.cos(th) * r };
}

function launchFighter(f, startHour, targetHour, powerVal){
  const s = clockPos(startHour, START_R);
  const t = clockPos(targetHour, START_R);
  f.x = s.x; f.z = s.z;
  // 初速は目標の時計位置（同じ半径の点）への直線方向。大きさは従来どおり
  // （プレイヤーは長押しパワー、CPUはランダム）で、わずかなブレだけ付ける
  let dx = t.x - s.x, dz = t.z - s.z;
  const dl = Math.hypot(dx, dz); dx /= dl; dz /= dl;
  const jitter = (Math.random() - 0.5) * 0.12;
  const jx = dx * Math.cos(jitter) - dz * Math.sin(jitter);
  const jz = dx * Math.sin(jitter) + dz * Math.cos(jitter);
  const speed = (5.2 + powerVal * 0.075) / Math.sqrt(f.stats.mass);
  f.vx = jx * speed;
  f.vz = jz * speed;
  f.spin = f.stats.maxSpin; f.launched = true;
  f.mesh.visible = true;
}

/* 衝突の物理（跳ね返り）は即時適用し、スピンダメージだけをここに預ける。
   タップの「後から±TAP_WINDOW」も拾えるよう、窓が閉じてから resolvePendingClash で確定する */
function registerClash(dmgToP, dmgToC){
  firstClash = true;   // 初接触したので序盤ブーストはここで終わる
  if (pendingClash){
    pendingClash.dmgToP += dmgToP;
    pendingClash.dmgToC += dmgToC;
  } else {
    pendingClash = { t: nowS(), dmgToP, dmgToC };
  }
}

/* スピンが0になったコマを「瀕死」として記録する（この時点では試合は終わらない）。
   スピンは0でクランプし、どちらが先に瀕死になったかを dyingSeq（採番）で覚える */
function markDying(){
  for (const f of [fighters.player, fighters.cpu]){
    if (f.spin <= 0){
      f.spin = 0;
      if (!f.dying){ f.dying = true; f.dyingSeq = ++dyingCounter; }
    }
  }
}

/* 瀕死のコマがジャスト成功したときの復活：スピンを回復し、瀕死を解除する */
function reviveFighter(f){
  f.spin = REVIVE_SPIN;
  f.dying = false;
  f.dyingSeq = 0;
}

function resolvePendingClash(){
  if (!pendingClash || nowS() < pendingClash.t + TAP_WINDOW) return;
  const pc = pendingClash;
  pendingClash = null;
  const P = fighters.player, C = fighters.cpu;
  // デモ対戦では両者ともタップの代わりに確率でジャスト成否を決める（難易度は適用しない）。
  // 瀕死時の復活ジャストも、この pOK / cOK をそのまま使う
  const pOK = demoMode ? Math.random() < DEMO_JUST_RATE
                       : tapTimes.some(t => Math.abs(t - pc.t) <= TAP_WINDOW);
  const cOK = Math.random() < (demoMode ? DEMO_JUST_RATE : CPU_TAP_RATE);
  // ブースト発動中に解決した衝突は、ジャストの勝敗ダメージが BOOST_DMG 倍になる
  // （勝てば大きく与え、負ければ大きく受ける）。両者のブーストは対称に効く：
  // 勝ち側の発動で「与える」が倍、負け側の発動で「受ける」が倍になり、
  // 両者とも発動中なら合計4倍になる。
  // 発動が切れていれば、速度の減衰が残っていてもダメージは通常に戻る
  const pBoost = boostActiveOf(boostP);
  const cBoost = boostActiveOf(boostC);
  // 瀕死のコマが関わる衝突は、通常の結果適用より先に決着／復活を判定する。
  // 瀕死側がジャストできれば復活して、この衝突は通常どおり解決する。
  // 瀕死側がジャストできなければ、その場で決着する
  if (P.dying || C.dying){
    const pFail = P.dying && !pOK;
    const cFail = C.dying && !cOK;
    if (pFail && cFail){
      // 両者とも瀕死で両方失敗：先に瀕死になった方（dyingSeqが小さい方）の負け
      return endBattle(P.dyingSeq > C.dyingSeq, 'finish');
    }
    if (pFail){
      // CPUがジャストでとどめを刺した場合は赤（CPUのブースト中なら特大）
      spawnCpuJustBurst(P.x, P.z, cBoost && cOK);
      return endBattle(false, 'finish');
    }
    if (cFail){
      // プレイヤーがジャスト成功してとどめを刺した場合は青（ブースト中なら特大）
      if (pOK) spawnJustBurst(C.x, C.z, pBoost);
      return endBattle(true, 'finish');
    }
    if (P.dying) reviveFighter(P);
    if (C.dying) reviveFighter(C);
  }
  const pushLoser = (loser, winner) => {
    const dx = loser.x - winner.x, dz = loser.z - winner.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.01) return;
    const kb = KB_PUSH * (1 + FAIL_KB_RATE * loser.fails);
    loser.vx += (dx / d) * kb;
    loser.vz += (dz / d) * kb;
  };
  if (pOK && cOK){
    // 相殺：両者ノーダメージ。まず互いに跳ね返り（ノックバック）、
    // その後テンションの引き寄せで再接近する流れにする
    tension++;
    drawCount++;   // 相殺エスカレーション：回数を積み上げる（試合中リセットしない）
    const dx = C.x - P.x, dz = C.z - P.z;
    const d = Math.hypot(dx, dz);
    if (d > 0.01){
      // ノックバックは相殺回数に応じて大きくなる（今回の相殺自体を含む）
      const kb = KB_PUSH * 0.85 * (1 + DRAW_KB_RATE * drawCount);
      // 法線方向の跳ね返りに、各コマの現在位置における時計回りの接線成分を少し混ぜる。
      // 接線は周回力と同じ定義（位置ベクトルを90°回した向き × orbit）を使い、
      // 跳ね返った後も真っ直ぐ離れず、周回の流れを保ったまま離れるようにする
      const nx = dx / d, nz = dz / d;
      const pushWithTan = (f, dir) => {
        const r = Math.hypot(f.x, f.z);
        let tx = f.orbit, tz = 0;   // 中心付近では接線が定まらないので既定値
        if (r > 0.3){ tx = (-f.z / r) * f.orbit; tz = (f.x / r) * f.orbit; }
        f.vx += nx * dir * kb + tx * kb * DRAW_KB_TAN;
        f.vz += nz * dir * kb + tz * kb * DRAW_KB_TAN;
      };
      pushWithTan(P, -1);
      pushWithTan(C, +1);
    }
    // ペース倍率を永続的に引き上げ、両コマの現在の速度にも比率分を即座に掛けて
    // 「実際に速くなり続ける」形にする（上限 PACE_CAP）。速度上限・周回ペースへは
    // stepBattle 側で paceMult を介して反映される
    const newPace = Math.min(PACE_CAP, 1 + PACE_STEP * drawCount);
    if (newPace > paceMult){
      const kick = newPace / paceMult;
      paceMult = newPace;
      P.vx *= kick; P.vz *= kick;
      C.vx *= kick; C.vz *= kick;
    }
    triggerClashFX((P.x + C.x) / 2, (P.z + C.z) / 2, 0.55, true);
    // 相殺のバーストは黄色で派手さ控えめ（小さめ・薄め・短め）
    spawnBurst((P.x + C.x) / 2, (P.z + C.z) / 2, 0xffd34d,
      { from: 0.8, to: 1.6, dur: 0.22, opacity: 0.55 });
    addHitstop(0.06);
    showClash('draw', '相殺！');
  } else if (pOK){
    C.fails++;
    C.spin -= pc.dmgToC * CLASH_WIN_DMG * (pBoost ? BOOST_DMG : 1) * (cBoost ? BOOST_DMG : 1);
    pushLoser(C, P);
    triggerClashFX(C.x, C.z, 0.85, true);
    spawnJustBurst(C.x, C.z, pBoost);   // プレイヤーのジャスト成功＝青
    addHitstop(0.08);
    showClash('good', 'ジャスト！');
  } else if (cOK){
    P.fails++;
    P.spin -= pc.dmgToP * CLASH_WIN_DMG * (cBoost ? BOOST_DMG : 1) * (pBoost ? BOOST_DMG : 1);
    pushLoser(P, C);
    triggerClashFX(P.x, P.z, 0.85, true);
    spawnCpuJustBurst(P.x, P.z, cBoost);   // CPUのジャスト成功（プレイヤー失敗）＝赤。CPUのブースト中は特大
    addHitstop(0.08);
    showClash('bad', '失敗…');
  } else {
    P.fails++; C.fails++;
    P.spin -= pc.dmgToP;
    C.spin -= pc.dmgToC;
    showClash('bad', '失敗…');
  }
}

/* 物理の1ステップ（stepBattle からサブステップで複数回呼ばれる）。
   力（斜面・周回ドライブ・押し出し・引き寄せ）はブースト前のスケールで計算し、
   ブーストで変わるのはそのコマの摩擦の弱さと遠心力補正だけ（両者対称） */
function stepPhysics(sdt, multP, multC){
  const P = fighters.player, C = fighters.cpu;
for (const f of [P, C]){
  if (!f.launched) continue;
  // このコマの「力」のスケール：両コマ共通のペース倍率 × そのコマ個別のスピード倍率。
  // ブースト倍率は力（周回ドライブ・最低速度の押し出し）には掛けない。
  // ブーストで変わるのは摩擦の弱さと遠心力補正だけにして、「速さだけが変わる」形にする
  const spdScale = paceMult * f.stats.spdMult;
  const fMult = (f === P) ? multP : multC;   // このコマ自身のブースト倍率
  const isBoosting = fMult > 1;
  // スピン減衰（ステータスに依存しない一定値）
  f.spin -= SPIN_DECAY * sdt;
  const d = Math.hypot(f.x, f.z);
  // すり鉢効果：斜面に沿って中心へ引かれる（距離に比例。傾斜強化で係数2.4→3.0）
  // 縁（ARENA_R）の外側では斜面が下向きに転じるので、外へ滑り落ちる力に切り替える
  if (d > 0.01){
    const a = d <= ARENA_R ? SLOPE_PULL * d : -4.4;
    f.vx -= (f.x / d) * a * sdt;
    f.vz -= (f.z / d) * a * sdt;
  }
  // 遠心力の補正（ブースト中のみ）：速くなった分だけ軌道が外に膨らむのを防ぐ内向き加速度。
  // 半径 d の円軌道に必要な向心加速度 v^2/d のうち、ブースト前の等価速度 (v/N) の分は
  // 斜面とドライブがまかなう前提で、不足分 (1 - 1/N^2) だけを補う。
  // ただし補正は「外に膨らむのを抑える」ためだけに使い、中心付近では効かせない：
  // 以前の形だと d が小さい場所で補正が過大になり、中心に吸い付いて小さな円を
  // 描き続けてしまった。そこで
  //   ・d<=1.5 で補正ゼロ、d>=3.5 でフル、その間は smoothstep で滑らかにフェード
  //   ・割る距離には下限 2.5 を設ける
  //   ・補正加速度自体に上限 30 を設ける
  if (isBoosting && d > 0.01){
    const fadeT = Math.min(1, Math.max(0, (d - 1.5) / (3.5 - 1.5)));
    const fade = fadeT * fadeT * (3 - 2 * fadeT);
    if (fade > 0){
      const v2 = f.vx * f.vx + f.vz * f.vz;
      const dEff = Math.max(d, 2.5);
      const aCent = Math.min((v2 / dEff) * (1 - 1 / (fMult * fMult)) * fade, 30);
      f.vx -= (f.x / d) * aCent * sdt;
      f.vz -= (f.z / d) * aCent * sdt;
    }
  }
  // 摩擦（旧0.5→0.22に弱めて、滑りが長続きするように）。
  // ブースト中はそのコマだけ摩擦係数を 1/N に弱める：力はブースト前のまま、
  // 減衰だけが弱くなるので、到達速度がおよそ N 倍まで伸びる
  const fr = Math.exp(-BASE_FRICTION / (isBoosting ? fMult : 1) * sdt);
  f.vx *= fr; f.vz *= fr;
  // 静止させない：進行方向を曲げて土俵を周回させる力＋最低速度の維持。
  // 移動の挙動はスピン量に依存しない（スピン0＝瀕死でも今まで通り動き回る）。
  // スピンが効くのは数値管理（ダメージ・減衰・瀕死判定）と
  // 見た目のフラフラ（syncFighters 側）だけに限定する
  {
    const spd = Math.hypot(f.vx, f.vz);
    if (spd > 0.05){
      // 速度に垂直な向きの力（強さはスピン残量によらず一定）。両者とも時計回り
      const px = -f.vz / spd, pz = f.vx / spd;
      const drive = 1.15 * spdScale;
      f.vx += px * f.orbit * drive * sdt;
      f.vz += pz * f.orbit * drive * sdt;
    }
    if (spd < 0.55 * spdScale){
      // 止まりそうになったら、土俵の接線方向へそっと押し出す
      let tx, tz;
      if (d > 0.3){ tx = (-f.z / d) * f.orbit; tz = (f.x / d) * f.orbit; }
      else { tx = f.orbit; tz = 0; }
      f.vx += tx * 2.4 * spdScale * sdt;
      f.vz += tz * 2.4 * spdScale * sdt;
    }
  }
  // 速度の上限（斜面加速での暴走防止）
  {
    const spd = Math.hypot(f.vx, f.vz);
    const cap = 13 * spdScale * (isBoosting ? fMult : 1);   // 安全弁。到達速度そのものは摩擦の仕組み側で決まる
    if (spd > cap){ f.vx *= cap / spd; f.vz *= cap / spd; }
  }
  // ※フラつきの速度ノイズは廃止した（軌道を乱していたため）。
  //   フラフラは syncFighters でメッシュの表示位置・傾きだけに付けている
  f.x += f.vx * sdt;
  f.z += f.vz * sdt;
  // 縁のヘリ（常時ガードレール）：コマは決して場外に出ない。
  // ヘリに到達したら位置を内側にクランプし、外向き（径方向）速度だけを
  // 反発係数0.55で跳ね返す。接線成分は保持するので、周回の流れは止まらない
  {
    const dLip = Math.hypot(f.x, f.z);
    if (dLip > LIP_R){
      const nx = f.x / dLip, nz = f.z / dLip;
      f.x = nx * LIP_R; f.z = nz * LIP_R;
      const vr = f.vx * nx + f.vz * nz;   // 外向きの径方向速度
      if (vr > 0){
        f.vx -= (1 + 0.55) * vr * nx;
        f.vz -= (1 + 0.55) * vr * nz;
      }
    }
  }
}

// テンションによる引き寄せ（相殺が続くほど接近が速くなり、タップが難しくなる）
if (tension > 0 && P.launched && C.launched){
  const dx = C.x - P.x, dz = C.z - P.z;
  const d = Math.hypot(dx, dz);
  if (d > 0.01){
    const a = TENSION_PULL * Math.min(tension, TENSION_CAP) * sdt;
    P.vx += (dx / d) * a; P.vz += (dz / d) * a;
    C.vx -= (dx / d) * a; C.vz -= (dz / d) * a;
  }
}

// ブースト中の引き寄せ：ブーストで速度が上がっている間だけ、そのコマが
// 相手方向へ強く引かれ、軌道が相手に向かってはっきり曲がる（両者対称）。
// 強さはブースト倍率の進み具合（(倍率-1)/(設定倍率-1)）に比例させるので、
// 減衰フェーズでは弱まりながら消えていく
for (const [f, o, m] of [[P, C, multP], [C, P, multC]]){
  if (m <= 1 || !f.launched || !o.launched) continue;
  const dx = o.x - f.x, dz = o.z - f.z;
  const d = Math.hypot(dx, dz);
  if (d > 0.01){
    const a = BOOST_PULL * (m - 1) / Math.max(0.001, BOOST_MULT - 1) * sdt;
    f.vx += (dx / d) * a; f.vz += (dz / d) * a;
  }
}

// 序盤ブースト：発射直後の数秒だけ、両者を引き寄せる追加の力をかけて初接触を早める。
// OPENING_TIME 秒かけて線形に減衰し、初接触した時点でも終了するため、
// 中盤以降の物理（すり鉢の引力・摩擦・周回力・テンション等の基本定数）には影響しない
if (!firstClash && fightTime < OPENING_TIME && P.launched && C.launched){
  const dx = C.x - P.x, dz = C.z - P.z;
  const d = Math.hypot(dx, dz);
  if (d > 0.01){
    const a = OPENING_PULL * (1 - fightTime / OPENING_TIME) * sdt;
    P.vx += (dx / d) * a; P.vz += (dz / d) * a;
    C.vx -= (dx / d) * a; C.vz -= (dz / d) * a;
  }
}

// コマ同士の衝突
if (P.launched && C.launched){
  const dx = C.x - P.x, dz = C.z - P.z;
  const dist = Math.hypot(dx, dz);
  const minDist = P.stats.radius + C.stats.radius;
  if (dist > 0.0001 && dist < minDist){
    const nx = dx / dist, nz = dz / dist;
    const mP = P.stats.mass;
    const mC = C.stats.mass;
    const invP = 1 / mP, invC = 1 / mC, invSum = invP + invC;
    // めり込み解消
    const overlap = minDist - dist;
    P.x -= nx * overlap * (invP / invSum); P.z -= nz * overlap * (invP / invSum);
    C.x += nx * overlap * (invC / invSum); C.z += nz * overlap * (invC / invSum);
    // 接近している時だけインパルスとスピンダメージ
    const rvn = (C.vx - P.vx) * nx + (C.vz - P.vz) * nz;
    if (rvn < 0){
      const jimp = -(1 + 0.9) * rvn / invSum;
      P.vx -= jimp * invP * nx; P.vz -= jimp * invP * nz;
      C.vx += jimp * invC * nx; C.vz += jimp * invC * nz;
      // ノックバック強化：衝突の強さに比例した追加の押し出しで、
      // ぶつかったコマ同士が目に見えて弾き合って離れるようにする。
      // 追加する相対分離速度は push 本体（弱い接触で約0.9、強い衝突で約4.1）で、
      // 質量の逆数比で両者へ配分する。土俵の物理定数には触れない
      const strength = Math.min(1, Math.abs(rvn) / 9);
      const push = 0.5 + 3.6 * strength;
      P.vx -= nx * push * (invP / invSum); P.vz -= nz * push * (invP / invSum);
      C.vx += nx * push * (invC / invSum); C.vz += nz * push * (invC / invSum);
      const impact = 0.6 + Math.min(1.4, Math.abs(rvn) * 0.12);
      // 接触点で演出（火花・衝撃波・シェイク・効果音）。強い衝突ではヒットストップも
      triggerClashFX(P.x + nx * P.stats.radius, P.z + nz * P.stats.radius, strength, false);
      if (strength > 0.5) addHitstop(0.06);
      // 与ダメージは攻撃側の「こうげき」倍率だけで決まる（防御・トゲ等の特殊補正は廃止）
      const dmg = atkF => Math.max(0.3, atkF.stats.atkMult * impact);
      // スピンダメージは即時適用せず、タップ判定（resolvePendingClash）に委ねる
      registerClash(dmg(C), dmg(P));
    }
  }
}
}

function stepBattle(dt){
  const P = fighters.player, C = fighters.cpu;
  fightTime += dt;

  resolvePendingClash();
  if (phase !== 'fight') return;   // 衝突の解決で決着した場合はここで止める
  markDying();   // 衝突ダメージでスピンが0になったコマを瀕死として記録する
  updateBoostGauges(dt);   // 両者分のブーストゲージの消費・回復・クールタイムを進める

  if (cpuTimer > 0){
    cpuTimer -= dt;
    if (cpuTimer <= 0) launchFighter(C, CPU_START_HOUR, CPU_TARGET_HOUR, 45 + Math.random() * 50);
  }

  // CPUのブーストAI：使用可能なら接近状況を見て確率で発動する
  // （デモ対戦では player 側のCPU1も同じAIでブーストを使う）
  tryCpuBoost(C, P, boostC, dt);
  if (demoMode) tryCpuBoost(P, C, boostP, dt);

  const multP = currentBoostMult(), multC = cpuBoostMult();   // 両者のブースト倍率（このフレームの値）
  // サブステップ分割：高速移動時に相手をすり抜けて接触判定が飛ばないよう、
  // 1サブステップあたりの移動量が接触距離の半分以下になるよう積分を分割する
  const maxSpd = Math.max(Math.hypot(P.vx, P.vz), Math.hypot(C.vx, C.vz));
  const contactDist = P.stats.radius + C.stats.radius;
  const nSub = Math.min(48, Math.max(1, Math.ceil(maxSpd * dt / (contactDist * 0.5))));
  const sdt = dt / nSub;
  for (let sub = 0; sub < nSub; sub++) stepPhysics(sdt, multP, multC);
  // 瀕死の記録：スピンが0になっても試合は終わらない（決着は次の接触で決まる）
  markDying();
  // 制限時間（保険）：残りスピンが多い方の勝ち。
  // 両方ともスピン0（瀕死）なら、先に瀕死になった方の負け
  if (fightTime > 90){
    if (P.spin !== C.spin) return endBattle(P.spin > C.spin, 'time');
    if (P.dying && C.dying) return endBattle(P.dyingSeq > C.dyingSeq, 'time');
    return endBattle(true, 'time');
  }
}

/* --- 瀕死サイン（本体とゲージの赤色点滅） --- */
const DYING_RED = new THREE.Color(0xe0331e);
const DYING_PERIOD = 0.4;   // 点滅の周期（秒）
const GAUGE_P = 'linear-gradient(90deg,#e8a34c,#cf6f2a)';
const GAUGE_C = 'linear-gradient(90deg,#a9c46a,#7a9a4d)';
const GAUGE_RED_ON  = 'linear-gradient(90deg,#f0563f,#d42a16)';
const GAUGE_RED_OFF = 'linear-gradient(90deg,#93382c,#701a10)';

function syncFighters(dt, t){
  if (!fighters) return;
  const blinkOn = (t % DYING_PERIOD) < DYING_PERIOD / 2;
  for (const f of [fighters.player, fighters.cpu]){
    if (!f.launched) continue;
    const d = Math.hypot(f.x, f.z);
    let y = bowlY(Math.min(d, ARENA_R + 0.6));
    const spinNow = Math.max(0, f.spin);
    const spinRatio = spinNow / f.stats.maxSpin;   // 体力の残り割合（フラフラはこの割合だけで決める）
    // フラフラは見た目だけ：スピンの残り割合が低いほどメッシュの表示位置を小さく揺らす
    // （物理位置 f.x/f.z には一切触れない）
    let jx = 0, jz = 0;
    if (spinRatio < 0.5){
      const wob = (0.5 - spinRatio) / 0.5;
      const amp = wob * 0.055;
      jx = Math.sin(t * 13.7 + f.phase * 3.1) * amp;
      jz = Math.cos(t * 11.3 + f.phase * 2.3) * amp;
    }
    f.mesh.position.set(f.x + jx, y, f.z + jz);
    f.mesh.userData.spinG.rotation.y += f.spinDir * (3 + spinRatio * 45) * dt;
    const tilt = (1 - spinRatio) * 0.30;
    f.mesh.rotation.x = Math.cos(t * 6.7 + f.phase) * tilt * 0.5;
    f.mesh.rotation.z = Math.sin(t * 8.0 + f.phase) * tilt * 0.5;
    // 瀕死サイン：本体（実と帽子）を赤く点滅させる。復活すれば元の色に戻る
    if (f.mesh.userData.blink){
      for (const b of f.mesh.userData.blink){
        if (f.dying && blinkOn){
          b.mat.color.copy(b.base).lerp(DYING_RED, 0.78);
          b.mat.emissive.copy(DYING_RED);
          b.mat.emissiveIntensity = 0.5;
        } else if (f.dying){
          b.mat.color.copy(b.base).lerp(DYING_RED, 0.28);
          b.mat.emissive.setRGB(0, 0, 0);
          b.mat.emissiveIntensity = 0;
        } else {
          b.mat.color.copy(b.base);
          b.mat.emissive.setRGB(0, 0, 0);
          b.mat.emissiveIntensity = 0;
        }
      }
    }
  }
  // ゲージは自分の最大体力に対する割合で表示する
  spinBarP.style.width = Math.max(0, fighters.player.spin / fighters.player.stats.maxSpin * 100) + '%';
  spinBarC.style.width = Math.max(0, fighters.cpu.spin / fighters.cpu.stats.maxSpin * 100) + '%';
  // 瀕死サイン：そのコマ側のゲージも赤く点滅させる
  spinBarP.style.background = fighters.player.dying ? (blinkOn ? GAUGE_RED_ON : GAUGE_RED_OFF) : GAUGE_P;
  spinBarC.style.background = fighters.cpu.dying ? (blinkOn ? GAUGE_RED_ON : GAUGE_RED_OFF) : GAUGE_C;
}

/* --- 発射操作（長押し） --- */
launchBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  if (demoMode) return;   // デモ対戦ではボタン自体が無効
  if (phase === 'ready'){
    charging = true; power = 0;
  } else if (phase === 'fight'){
    // 発射後は同じボタンがブーストボタンとして働く。タップした瞬間に発動し、
    // BOOST_DURATION 秒（固定）発動し続ける。途中で止めることはできない。
    // 一度使うと、ゲージがMaxまで回復してクールタイムが終わるまでは再使用できない
    // （発動中・回復中・クールタイム中のタップは何も起きない）
    if (boostP.canUse) activateBoost(boostP);
  }
});
/* 両コマを同時に発射してバトルを開始する（通常モード・デモ対戦で共用） */
function launchBoth(pPower, cPower){
  launchFighter(fighters.player, PLAYER_START_HOUR, PLAYER_TARGET_HOUR, pPower);
  launchFighter(fighters.cpu, CPU_START_HOUR, CPU_TARGET_HOUR, cPower);
  phase = 'fight'; fightTime = 0; cpuTimer = -1;
  // 発射後は同じボタンを「ブースト」に切り替える（デモ対戦ではボタンを出さないので無効のまま）
  if (demoMode) launchBtn.disabled = true;
  else { launchBtn.disabled = false; launchBtn.textContent = 'ブースト'; }
  powerFill.style.width = '0%';
}
function releaseLaunch(){
  if (!charging) return;
  charging = false;
  if (phase !== 'ready' || !fighters) return;
  launchBoth(power, 45 + Math.random() * 50);   // CPUも同時に発射（着地タイミングを揃える）
}
window.addEventListener('pointerup', releaseLaunch);
window.addEventListener('pointercancel', releaseLaunch);

/* --- ブーストの状態遷移（プレイヤー側・CPU側とも同じ仕様で対称） ---
   発動し、BOOST_DURATION 秒の間は BOOST_MULT。
   発動が切れたら続く BOOST_FADE 秒で通常速度（×1.0）へ戻る */
function boostMultOf(bs){
  if (phase !== 'fight') return 1;
  const now = nowS();
  if (now < bs.endT) return BOOST_MULT;   // 発動中
  if (bs.endT >= 0 && now - bs.endT < BOOST_FADE)
    return 1 + (BOOST_MULT - 1) * (1 - (now - bs.endT) / BOOST_FADE);
  return 1;
}
function currentBoostMult(){ return boostMultOf(boostP); }   // プレイヤー側
function cpuBoostMult(){ return boostMultOf(boostC); }       // CPU側

/* ブーストを発動させる（プレイヤーはタップ、CPUはAIが呼ぶ）。発動でゲージは全消費扱い */
function activateBoost(bs){
  bs.canUse = false;
  bs.fullT = -1;
  bs.startT = nowS();
  bs.endT = bs.startT + BOOST_DURATION;
  bs.gauge = BOOST_GAUGE_MAX;
}

/* ダメージ倍率（BOOST_DMG）が有効かどうかは状態ごと：発動中はずっと有効で、
   発動が切れた瞬間に（速度の減衰が残っていても）ダメージ倍率は通常に戻る */
function boostActiveOf(bs){
  return phase === 'fight' && nowS() < bs.endT;
}
function boostDmgActive(){ return boostActiveOf(boostP); }   // プレイヤー側

/* --- ブーストゲージの消費・回復・クールタイム（状態ごと） ---
   発動するとゲージは全消費扱い：発動中は残り発動時間に連動して5秒分が減っていき、
   切れた時点で0になる。回復は発動が切れてから進み、全消費なので
   BOOST_GAUGE_MAX × BOOST_RECOVER_RATE 秒（7.5秒）で全回復する。
   ゲージがMaxに戻ってから BOOST_COOLDOWN 秒経つまで再使用できない */
function updateBoostState(bs, dt, wrapEl){
  if (nowS() < bs.endT){
    // 発動中：ゲージは残り発動時間そのもの
    bs.gauge = Math.max(0, bs.endT - nowS());
  } else if (bs.gauge < BOOST_GAUGE_MAX){
    bs.gauge = Math.min(BOOST_GAUGE_MAX, bs.gauge + dt / BOOST_RECOVER_RATE);
    if (bs.gauge >= BOOST_GAUGE_MAX && bs.fullT < 0) bs.fullT = nowS();
  }
  if (!bs.canUse && bs.fullT >= 0 && nowS() - bs.fullT >= BOOST_COOLDOWN){
    bs.canUse = true;
    bs.fullT = -1;
    // 使えるようになった合図：その側のゲージの枠を一度だけ光らせる
    wrapEl.classList.remove('ready-flash');
    void wrapEl.offsetWidth;
    wrapEl.classList.add('ready-flash');
  }
}
function updateBoostGauges(dt){
  if (phase !== 'fight') return;
  updateBoostState(boostP, dt, boostGaugeWrap);
  updateBoostState(boostC, dt, boostGaugeWrapC);
}

/* --- CPUのブーストAI ---
   使用可能になった後、相手との距離と接近状況を見て、毎秒 rate の確率で発動する
   （フレームごとに rate×dt を引くので、発動タイミングは自然にばらける）。
   発動条件：両者発射済みで、相手に接近中（相対速度が近づく向き）か、距離が近い（中心間3.5未満）。
   相手が瀕死ならとどめを狙って finisher 倍、相手の残りスピンが25%以下でも2倍、
   自分が瀕死なら被ダメージ2倍のリスクを避けて半分に下げる。
   難易度で頻度を変える：イージー 0.05/秒（滅多に使わない）、ノーマル 0.25/秒、ハード 0.70/秒。
   デモ対戦では両CPUともノーマル相当のAIを使う */
const CPU_BOOST_AI = {
  easy:   { rate: 0.05, finisher: 3 },
  normal: { rate: 0.25, finisher: 4 },
  hard:   { rate: 0.70, finisher: 5 },
};
function tryCpuBoost(f, o, bs, dt){
  if (!bs.canUse || phase !== 'fight' || !f.launched || !o.launched) return;
  const prof = CPU_BOOST_AI[demoMode ? 'normal' : difficulty];
  const dx = o.x - f.x, dz = o.z - f.z;
  const dist = Math.hypot(dx, dz);
  const closing = (dx * (o.vx - f.vx) + dz * (o.vz - f.vz)) < 0;   // 相手に近づいているか
  if (!closing && dist >= 3.5) return;
  let rate = prof.rate;
  if (o.dying) rate *= prof.finisher;                    // とどめ狙い
  else if (o.spin <= o.stats.maxSpin * 0.25) rate *= 2;  // 追い詰めている
  if (f.dying) rate *= 0.5;                              // 自分が瀕死なら慎重に
  if (Math.random() < rate * dt) activateBoost(bs);
}

/* --- ブースト中の残像（簡素版） ---
   ブースト中のプレイヤーのコマのゴーストを薄く残すだけの軽い演出。
   ゴーストはプール化し（組み立てが変わったら作り直す）、個別マテリアルの
   opacity でフェードさせる。重いパーティクル類は使わない */
const TRAIL_MAX = 12;          // 同時に残す残像の数
const TRAIL_LIFE = 0.35;       // 残像が消えるまでの秒数
const TRAIL_INTERVAL = 0.04;   // 残像を置く間隔（秒）
const TRAIL_OPACITY = 0.30;    // 残像の最大の濃さ
let trailGhosts = [];          // { obj, spinG, mat, life }
let trailKey = '';
let trailTimer = 0;

function clearTrailPool(){
  for (const g of trailGhosts){
    battleScene.remove(g.obj);
    g.obj.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && o.material !== g.mat) o.material.dispose();
    });
    g.mat.dispose();
  }
  trailGhosts = [];
  trailKey = '';
}

function ensureTrailPool(sel){
  const key = JSON.stringify(sel);
  if (key === trailKey && trailGhosts.length) return;
  clearTrailPool();
  trailKey = key;
  for (let i = 0; i < TRAIL_MAX; i++){
    const obj = buildTopMesh(sel, 'player');
    const mat = new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0, depthWrite: false });
    obj.traverse(o => {
      if (o.isMesh){
        o.material.dispose();   // buildTopMesh が作ったマテリアルは使わないので破棄
        o.material = mat;
        o.castShadow = false;
        o.receiveShadow = false;
      }
    });
    obj.visible = false;
    battleScene.add(obj);
    trailGhosts.push({ obj, spinG: obj.userData.spinG, mat, life: 0 });
  }
}

function updateTrail(dt){
  const P = fighters && fighters.player;
  const boosting = !demoMode && phase === 'fight' && P && P.launched && currentBoostMult() > 1;
  if (boosting){
    ensureTrailPool(P.sel);
    trailTimer -= dt;
    if (trailTimer <= 0){
      trailTimer = TRAIL_INTERVAL;
      const slot = trailGhosts.find(g => g.life <= 0) || trailGhosts[0];
      if (slot){
        // 本体の表示姿勢（位置・傾き・自転）をそのまま写す
        slot.obj.position.copy(P.mesh.position);
        slot.obj.rotation.copy(P.mesh.rotation);
        if (slot.spinG && P.mesh.userData.spinG) slot.spinG.rotation.y = P.mesh.userData.spinG.rotation.y;
        slot.life = TRAIL_LIFE;
        slot.obj.visible = true;
      }
    }
  } else {
    trailTimer = 0;
  }
  for (const g of trailGhosts){
    if (g.life <= 0) continue;
    g.life -= dt;
    if (g.life <= 0){ g.obj.visible = false; g.mat.opacity = 0; continue; }
    g.mat.opacity = TRAIL_OPACITY * (g.life / TRAIL_LIFE);
  }
}

/* --- 衝突タイミング用のタップ記録（バトル中、画面のどこでもよい） --- */
window.addEventListener('pointerdown', e => {
  // ブーストボタン（と上部のブーストゲージ）上のポインタ操作はジャスト判定のタップとして記録しない
  if (e.target.closest && e.target.closest('#launch-btn, #boost-gauge-wrap, #boost-gauge-wrap-cpu')) return;
  if (screen === 'battle' && phase === 'fight') tapTimes.push(nowS());
});

/* --- ブーストボタンの表示 ---
   ダメージ倍率が有効な間（＝発動中）＝赤（.boosting）、
   発動が切れて速度だけが残っている減衰フェーズ＝残り倍率の割合で
   減衰色から通常色へ徐々に戻す。
   色の切り替わりで「ダメージ倍率がまだ有効か」が読めるようにするための表示 */
const BOOST_BTN_KEEP = new THREE.Color(0xe86a1e);   // 減衰フェーズの色
const BOOST_BTN_BASE = new THREE.Color(0xcf6f2a);   // 通常色（--accent と同じ）
const _boostBtnCol = new THREE.Color();
function updateBoostBtn(){
  updateBoostGaugeUI();
  launchBtn.classList.remove('boosting', 'boost-keep');
  if (boostDmgActive()){
    launchBtn.classList.add('boosting');
    launchBtn.style.background = '';
    launchBtn.style.boxShadow = '';
    return;
  }
  const m = (!demoMode && phase === 'fight') ? currentBoostMult() : 1;
  if (m <= 1){
    launchBtn.style.background = '';
    launchBtn.style.boxShadow = '';
    return;
  }
  // 減衰フェーズ：倍率が通常へ戻るにつれて色も通常色へ
  const k = (m - 1) / (BOOST_MULT - 1);
  _boostBtnCol.copy(BOOST_BTN_BASE).lerp(BOOST_BTN_KEEP, k);
  launchBtn.style.background = '#' + _boostBtnCol.getHexString();
  launchBtn.style.boxShadow = '';
}

/* --- ブーストゲージの表示 ---
   バトル中は画面上部（各体力ゲージの下）に両者分の行を出し、
   残量と状態を色で示す：発動中＝赤系で減っていく／回復中＝青灰で戻っていく
   （ボタンは無効表示）／クールタイム中＝金で満タン表示だがまだ無効／使用可能＝橙で満タン。
   デモ対戦でも両CPUのゲージを同じ形で出す（実戦に近い見た目にするため）。
   発動中はボタンの赤表示を薄めないよう、ボタン自体の無効化はしない
   （発動中のタップはハンドラ側で無視される） */
function updateBoostRowUI(bs, rowEl, wrapEl, fillEl){
  fillEl.style.width = (bs.gauge / BOOST_GAUGE_MAX * 100) + '%';
  const active = nowS() < bs.endT;
  wrapEl.classList.toggle('using', active);
  wrapEl.classList.toggle('recovering', !active && !bs.canUse && bs.gauge < BOOST_GAUGE_MAX);
  wrapEl.classList.toggle('cooldown', !bs.canUse && bs.gauge >= BOOST_GAUGE_MAX);
}
function updateBoostGaugeUI(){
  const show = phase === 'fight';
  boostRow.style.display = show ? 'flex' : 'none';
  boostRowC.style.display = show ? 'flex' : 'none';
  if (!show) return;
  updateBoostRowUI(boostP, boostRow, boostGaugeWrap, boostGaugeFill);
  updateBoostRowUI(boostC, boostRowC, boostGaugeWrapC, boostGaugeFillC);
  // 回復中・クールタイム中はボタンを無効表示にする（発動中は赤表示を優先して無効化しない）
  launchBtn.disabled = !boostP.canUse && !boostDmgActive();
}

/* --- タイミング円の表示更新 --- */
function updateTimingUI(){
  if (!fighters) { timingRing.style.opacity = '0'; return; }
  updateBoostBtn();
  const P = fighters.player, C = fighters.cpu;
  const active = phase === 'fight' && P.launched && C.launched;
  timingRing.style.opacity = active ? '1' : '0';
  if (active){
    // 円の大きさはボディの縁同士の間隔（gap）に連動し、gap=0（接触）で点になる。
    // 平方根カーブなので、遠いときは縮みが遅く、近くなるにつれて徐々に速く縮む。
    // 中距離でも円のサイズが保たれて判定円として認識しやすく、最後はドットへ
    // 吸い込まれるように縮む
    const dist = Math.hypot(C.x - P.x, C.z - P.z);
    const gap = Math.max(0, dist - (P.stats.radius + C.stats.radius));
    const k = Math.min(1, gap / GAP_MAX);
    timingRing.style.transform = `scale(${Math.sqrt(k).toFixed(3)})`;
  }
  if (feedbackUntil && nowS() > feedbackUntil){
    feedbackUntil = 0;
    clashMsg.textContent = '';
    timingRing.classList.remove('good', 'draw', 'bad');
  }
  // 古いタップ記録の掃除
  const cutoff = nowS() - 1;
  while (tapTimes.length && tapTimes[0] < cutoff) tapTimes.shift();
}
launchBtn.addEventListener('contextmenu', e => e.preventDefault());

/* ================= デモ対戦（CPU同士の自動対戦） =================
   組み立ては両者ともランダム、発射は自動、ジャスト判定は DEMO_JUST_RATE の確率。
   バトルの物理・ルール（衝突・相殺・テンション・瀕死と決着・制限時間）は
   通常モードと完全に同じコードを通し、入力（発射とジャスト）だけを差し替える */
function startDemo(){
  demoMode = true;
  clearTimeout(demoTimer);
  nameP.textContent = 'CPU1';   // 茶色側（player枠）
  nameC.textContent = 'CPU2';   // 緑側（cpu枠）
  launchBtn.style.display = 'none';
  powerBarWrap.style.display = 'none';
  demoExitBtn.style.display = '';
  resultBtns.style.display = 'none';
  // 結果表示中でも「タイトルへ」に触れるよう、デモ中は結果オーバーレイをクリック透過にする
  resultScreen.style.pointerEvents = 'none';
  cpuBuild = randomBuild();
  startBattle(randomBuild());
  showScreen('battle');
  scheduleDemoLaunch();
}
function scheduleDemoLaunch(){
  clearTimeout(demoTimer);
  // 短い溜め（1秒弱）の後、両者同時に発射。パワーは両者ともランダム（45〜95）
  demoTimer = setTimeout(() => {
    if (!demoMode || screen !== 'battle' || phase !== 'ready' || !fighters) return;
    launchBoth(45 + Math.random() * 50, 45 + Math.random() * 50);
  }, 900);
}
function startNextDemo(){
  if (!demoMode) return;
  resultScreen.classList.remove('active');
  cpuBuild = randomBuild();
  startBattle(randomBuild());
  scheduleDemoLaunch();
}
function stopDemo(){
  demoMode = false;
  clearTimeout(demoTimer);
  nameP.textContent = 'あなた';
  nameC.textContent = 'CPU';
  launchBtn.style.display = '';
  powerBarWrap.style.display = '';
  demoExitBtn.style.display = 'none';
  resultBtns.style.display = '';
  resultScreen.style.pointerEvents = '';
  showScreen('title');
}
document.getElementById('demo-btn').addEventListener('click', () => { ensureAudio(); startDemo(); });
demoExitBtn.addEventListener('click', stopDemo);

/* --- バトルまわりのボタン --- */
document.getElementById('battle-btn').addEventListener('click', () => {
  ensureAudio();
  cpuBuild = randomBuild();
  startBattle();
  showScreen('battle');
});
document.getElementById('rematch-btn').addEventListener('click', () => {
  document.getElementById('screen-result').classList.remove('active');
  startBattle();
});
document.getElementById('rebuild-btn').addEventListener('click', () => {
  showScreen('build');
});

/* ================= リサイズとメインループ ================= */
/* バトルカメラのフィット計算：
   視点の向き（斜め見下ろし）は今まで通り (0, 11, 8.8) 方向に固定し、
   土俵の外周（縁・リム・ヘリを含む）上の点がすべて画面内（NDCで±0.96以内）に
   収まる距離を二分探索で求める。横幅が制約になる縦持ちでも左右が見切れない。 */
const battleDir = new THREE.Vector3(0, 11, 8.8).normalize();
const battleCamBase = new THREE.Vector3(0, 20, 16);   // フィットで決まったカメラ位置（シェイクの基準）
const fitPoints = [];
for (let i = 0; i < 24; i++){
  const a = (i / 24) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
  fitPoints.push(new THREE.Vector3(6.60 * ca, 1.45, 6.60 * sa));  // すり鉢の外周（深さ1.5に合わせた高さ）
  fitPoints.push(new THREE.Vector3(6.48 * ca, 1.86, 6.48 * sa));  // リムの外周・上端（リム中心1.73＋管半径0.13）
}
fitPoints.push(new THREE.Vector3(0, 1.86, 0));
const _fitV = new THREE.Vector3();
function battleFits(d){
  battleCam.position.copy(battleDir).multiplyScalar(d);
  battleCam.lookAt(0, 0, 0);
  battleCam.updateMatrixWorld();
  for (const p of fitPoints){
    _fitV.copy(p).project(battleCam);
    if (Math.abs(_fitV.x) > 0.96 || Math.abs(_fitV.y) > 0.96 || _fitV.z > 1) return false;
  }
  return true;
}
function fitBattleCamera(){
  battleCam.updateProjectionMatrix();
  let lo = 6, hi = 90;
  while (!battleFits(hi) && hi < 400) hi *= 1.5;   // 収まる上限の確保（通常は不要）
  for (let i = 0; i < 28; i++){
    const mid = (lo + hi) / 2;
    if (battleFits(mid)) hi = mid; else lo = mid;
  }
  battleFits(hi);   // 最終位置をカメラに反映
  battleCamBase.copy(battleCam.position);
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  previewCam.aspect = w / h;
  previewCam.updateProjectionMatrix();
  battleCam.aspect = w / h;
  fitBattleCamera();
}
window.addEventListener('resize', onResize);
onResize();

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.033, clock.getDelta());
  const t = clock.elapsedTime;
  // 描画領域（ビューポート）を切り替えるため、まず全画面をクリアしておく
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.clear();
  if (screen === 'battle'){
    if (charging){
      power = Math.min(100, power + dt * 95);
      powerFill.style.width = power + '%';
    }
    // ヒットストップ：短時間だけバトル全体の時間経過をほぼ止める
    let bdt = dt;
    if (hitstop > 0){ hitstop -= dt; bdt = dt * 0.06; }
    if (phase === 'fight') stepBattle(bdt);
    syncFighters(bdt, t);
    updateFX(bdt);
    updateTrail(bdt);
    updateTimingUI();
    // カメラ：フィット位置を基準に、シェイクの残り時間に応じてランダムにずらす
    battleCam.position.copy(battleCamBase);
    if (shakeT > 0){
      shakeT -= dt;
      const k = Math.max(0, shakeT / shakeDur) * shakeAmp;
      battleCam.position.x += (Math.random() * 2 - 1) * k;
      battleCam.position.y += (Math.random() * 2 - 1) * k * 0.6;
      battleCam.position.z += (Math.random() * 2 - 1) * k;
    }
    battleCam.lookAt(0, 0, 0);
    renderer.render(battleScene, battleCam);
  } else {
    if (previewTop) previewTop.userData.spinG.rotation.y += dt * 1.4;
    if (screen === 'build'){
      // プレビューはパネルより上の領域だけに描く（設定項目と重ねない）
      // カメラを引いて、コマの表示サイズはタイトル画面の約70%にする
      const rect = document.getElementById('build-preview-space').getBoundingClientRect();
      previewCam.aspect = rect.width / Math.max(1, rect.height);
      // 右横のステータスパネルにコマが隠れないよう、視点中心を右へずらしてコマを左寄せに表示する
      const camDist = Math.hypot(2.6 - 1.0, 7.54);
      const visW = 2 * Math.tan(previewCam.fov * Math.PI / 360) * camDist * previewCam.aspect;
      const shiftX = visW * 0.16;
      previewCam.position.set(shiftX, 2.6, 7.54);
      previewCam.lookAt(shiftX, 1.0, 0);
      previewCam.updateProjectionMatrix();
      const vy = window.innerHeight - rect.bottom;
      renderer.setScissorTest(true);
      renderer.setViewport(rect.left, vy, rect.width, rect.height);
      renderer.setScissor(rect.left, vy, rect.width, rect.height);
    } else {
      previewCam.aspect = window.innerWidth / window.innerHeight;
      previewCam.position.set(0, 2.1, 5.2);
      previewCam.lookAt(0, 1.0, 0);
      previewCam.updateProjectionMatrix();
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    }
    renderer.render(previewScene, previewCam);
  }
}
animate();
