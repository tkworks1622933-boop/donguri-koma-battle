<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>どんぐりコマバトル</title>
<style>
  :root{
    --ink:#4a3421;
    --accent:#cf6f2a;
    --accent-dark:#a8561c;
    --panel:rgba(255,250,238,.96);
    --line:#d8c49a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; color:var(--ink); overflow:hidden; overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    background:#f3e5c8; touch-action:none;
  }
  #stage{ position:fixed; inset:0; }
  #stage canvas{ display:block; }
  .screen{ position:fixed; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- タイトル ---------- */
  #screen-title{ align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at center, rgba(255,246,225,0) 40%, rgba(84,50,16,.28) 100%); }
  #screen-title h1{ font-size:clamp(34px,9vw,54px); margin:0 0 6px; letter-spacing:.04em;
    color:#6e4520; text-shadow:0 2px 0 #fff3d6, 0 4px 14px rgba(110,69,32,.35); }
  #screen-title p{ margin:0 0 34px; font-size:15px; color:#7a5a36; }
  .btn{
    font:inherit; font-weight:700; font-size:19px; color:#fff; background:var(--accent);
    border:none; border-radius:999px; padding:15px 40px; cursor:pointer;
    box-shadow:0 4px 0 var(--accent-dark), 0 8px 18px rgba(110,69,32,.3);
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--accent-dark); }
  .btn.sub{ background:#fffdf6; color:var(--ink); border:2px solid var(--accent);
    box-shadow:0 4px 0 #d8c49a; font-size:16px; padding:12px 26px; }

  /* ---------- 組み立て ---------- */
  #build-preview-space{ flex:1 1 auto; min-height:0; }
  #build-panel{
    background:var(--panel); border-radius:22px 22px 0 0;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(110,69,32,.18); max-height:54%; overflow-y:auto;
  }
  .group-label{ font-size:12px; font-weight:700; color:#9a7748; margin:10px 0 5px; letter-spacing:.08em; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    font:inherit; font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer;
    background:#fffdf6; color:var(--ink); border:2px solid var(--line);
  }
  .chip.sel{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .stats{ margin:12px 0 4px; display:grid; grid-template-columns:1fr 1fr; gap:5px 18px; }
  .stat{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .stat .slabel{ width:4.2em; color:#7a5a36; }
  .stat .pips{ font-size:13px; letter-spacing:3px; line-height:1; }
  .stat .pips .on{ color:var(--accent); }
  .stat .pips .off{ color:#e0cda1; }
  #build-panel .btn{ width:100%; margin-top:12px; }

  /* ---------- バトル ---------- */
  #hud{ padding:calc(10px + env(safe-area-inset-top)) 16px 0; display:flex; flex-direction:column; gap:6px;
    pointer-events:none; }
  .hud-row{ display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700;
    text-shadow:0 1px 0 rgba(255,250,238,.8); }
  .hud-row .hname{ width:3.4em; }
  .hud-row .bar{ flex:1; height:12px; background:rgba(255,253,246,.75); border:2px solid var(--line);
    border-radius:6px; overflow:hidden; }
  .hud-row .fill{ height:100%; width:100%; transition:width .12s linear; }
  #spin-player{ background:linear-gradient(90deg,#e8a34c,#cf6f2a); }
  #spin-cpu{ background:linear-gradient(90deg,#a9c46a,#7a9a4d); }
  #power-wrap{ margin-top:auto; padding:14px 18px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:12px; }
  #power-bar-wrap{ width:82%; max-width:340px; height:16px; background:rgba(255,253,246,.8);
    border:2px solid var(--line); border-radius:8px; overflow:hidden; }
  #power-fill{ height:100%; width:0%; background:linear-gradient(90deg,#e8a34c,#d23c1e); }
  #launch-btn{ touch-action:none; user-select:none; -webkit-user-select:none; }
  #launch-btn:disabled{ opacity:.45; box-shadow:none; }
  #battle-msg{ font-size:14px; font-weight:700; color:#6e4520; text-shadow:0 1px 0 rgba(255,250,238,.9);
    min-height:1.3em; }

  /* ---------- 結果 ---------- */
  #screen-result{ align-items:center; justify-content:center; background:rgba(74,45,18,.35); }
  #result-card{ background:var(--panel); border-radius:22px; padding:30px 34px; text-align:center;
    box-shadow:0 12px 32px rgba(60,35,10,.35); max-width:84vw; }
  #result-title{ font-size:38px; font-weight:800; margin:0 0 6px; color:#6e4520; }
  #result-reason{ margin:0 0 22px; font-size:14px; color:#7a5a36; }
  #result-card .btns{ display:flex; flex-direction:column; gap:12px; align-items:center; }
</style>
</head>
<body>
<div id="stage"></div>

<!-- タイトル -->
<div id="screen-title" class="screen active">
  <h1>どんぐり<br>コマバトル</h1>
  <p>パーツを組んで、土俵で対決！</p>
  <button id="play-btn" class="btn">あそぶ</button>
</div>

<!-- 組み立て -->
<div id="screen-build" class="screen">
  <div id="build-preview-space"></div>
  <div id="build-panel">
    <div class="group-label">軸（つまようじ）</div>
    <div class="chips" id="chips-axis"></div>
    <div class="group-label">本体（どんぐり）</div>
    <div class="chips" id="chips-body"></div>
    <div class="group-label">オプション</div>
    <div class="chips" id="chips-option"></div>
    <div class="stats" id="stats"></div>
    <button id="battle-btn" class="btn">バトル開始</button>
  </div>
</div>

<!-- バトル -->
<div id="screen-battle" class="screen">
  <div id="hud">
    <div class="hud-row"><span class="hname">あなた</span><div class="bar"><div class="fill" id="spin-player"></div></div></div>
    <div class="hud-row"><span class="hname">CPU</span><div class="bar"><div class="fill" id="spin-cpu"></div></div></div>
  </div>
  <div id="power-wrap">
    <div id="battle-msg">長押しでパワーをためて、はなして発射！</div>
    <div id="power-bar-wrap"><div id="power-fill"></div></div>
    <button id="launch-btn" class="btn">長押しでパワー</button>
  </div>
</div>

<!-- 結果 -->
<div id="screen-result" class="screen">
  <div id="result-card">
    <p id="result-title">勝ち！</p>
    <p id="result-reason"></p>
    <div class="btns">
      <button id="rematch-btn" class="btn">もう一度</button>
      <button id="rebuild-btn" class="btn sub">組み立てに戻る</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ================= パーツ定義 =================
   st: かいてん(spin) / こうげき(atk) / ぼうぎょ(def) / あんてい(stab) への寄与 */
const AXES = {
  normal: { name:'ふつう',   len:1.0,  r:0.050, mass:1.00, st:{ spin:3, atk:3, def:3, stab:3 } },
  long:   { name:'ロング',   len:1.5,  r:0.050, mass:1.00, st:{ spin:5, atk:2, def:3, stab:5 } },
  short:  { name:'ショート', len:0.62, r:0.050, mass:0.95, st:{ spin:1, atk:5, def:3, stab:2 } },
  fat:    { name:'ふと軸',   len:1.0,  r:0.105, mass:1.30, st:{ spin:3, atk:4, def:4, stab:3 } },
};
const BODIES = {
  maru: { name:'まる型', sx:1.00, sy:1.00, mass:1.00, st:{ spin:4, atk:4, def:4, stab:4 } },
  hoso: { name:'ほそ型', sx:0.82, sy:1.30, mass:0.80, st:{ spin:3, atk:6, def:2, stab:3 } },
  hira: { name:'ひら型', sx:1.16, sy:0.60, mass:1.10, st:{ spin:4, atk:2, def:6, stab:6 } },
};
const OPTIONS = {
  none:  { name:'なし',   mass:1.00, st:{ spin:0, atk:0, def:0, stab:0 } },
  toge:  { name:'トゲ',   mass:1.05, st:{ spin:0, atk:2, def:0, stab:0 }, spike:true },
  ring:  { name:'リング', mass:1.10, st:{ spin:1, atk:0, def:3, stab:1 } },
  omori: { name:'おもり', mass:1.35, st:{ spin:-1, atk:2, def:1, stab:0 } },
};
const STAT_KEYS = [
  ['spin','かいてん'], ['atk','こうげき'], ['def','ぼうぎょ'], ['stab','あんてい'],
];

function calcStats(sel){
  const a = AXES[sel.axis], b = BODIES[sel.body], o = OPTIONS[sel.option];
  const st = {};
  for (const [k] of STAT_KEYS){
    st[k] = Math.max(1, Math.min(12, a.st[k] + b.st[k] + o.st[k]));
  }
  return {
    st,
    mass: a.mass * b.mass * o.mass,
    radius: b.sx,                 // 基準半径1 × 本体の横スケール
    spike: !!o.spike,
  };
}

/* ================= コマの3Dモデル ================= */
const COL = {
  player: { nut:0xc07a35, cap:0x71461f },
  cpu:    { nut:0x8aa653, cap:0x5f7434 },
  shaft: 0xe8cf9f,
};

function latheFrom(pts, mat){
  const v = pts.map(p => new THREE.Vector2(p[0], p[1]));
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(v, 28), mat);
  mesh.castShadow = true;
  return mesh;
}

/* 原点＝軸の先端（下端）。spinGroup が回転し、root が位置と傾きを持つ */
function buildTopMesh(sel, side){
  const axis = AXES[sel.axis], body = BODIES[sel.body], opt = sel.option;
  const colors = COL[side];
  const root = new THREE.Group();
  const spinG = new THREE.Group();
  root.add(spinG);

  const nutMat  = new THREE.MeshStandardMaterial({ color:colors.nut, roughness:0.65 });
  const capMat  = new THREE.MeshStandardMaterial({ color:colors.cap, roughness:0.95 });
  const bodyH = 1.40 * body.sy;
  const below = 0.5 * axis.len;   // 本体より下に出る軸の長さ

  // 本体（どんぐり）: 実＋帽子＋へた
  const bodyG = new THREE.Group();
  bodyG.position.y = below;
  bodyG.scale.set(body.sx, body.sy, body.sx);
  const nut = latheFrom([
    [0.001,0.00],[0.30,0.02],[0.55,0.08],[0.78,0.22],[0.92,0.42],
    [0.99,0.62],[1.00,0.78],[0.94,0.92],[0.82,1.00],
  ], nutMat);
  const cap = latheFrom([
    [0.84,0.97],[0.97,1.03],[1.01,1.12],[0.95,1.22],[0.78,1.30],
    [0.52,1.36],[0.24,1.39],[0.001,1.40],
  ], capMat);
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.065, 0.24, 8), capMat);
  stem.position.set(0.03, 1.46, 0); stem.rotation.z = 0.18; stem.castShadow = true;
  bodyG.add(nut, cap, stem);

  // オプションパーツ（本体グループ内なので形に追随する）
  if (opt === 'toge'){
    const spikeMat = new THREE.MeshStandardMaterial({ color:0x6b6b6b, roughness:0.4, metalness:0.7 });
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < 6; i++){
      const th = (i / 6) * Math.PI * 2;
      const dir = new THREE.Vector3(Math.cos(th), 0, Math.sin(th));
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.34, 10), spikeMat);
      cone.position.set(dir.x * 1.05, 0.62, dir.z * 1.05);
      cone.quaternion.setFromUnitVectors(up, dir);
      cone.castShadow = true;
      bodyG.add(cone);
    }
  } else if (opt === 'ring'){
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.05, 0.075, 12, 36),
      new THREE.MeshStandardMaterial({ color:0xc9a227, roughness:0.35, metalness:0.8 }));
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.62; ring.castShadow = true;
    bodyG.add(ring);
  } else if (opt === 'omori'){
    const band = new THREE.Mesh(
      new THREE.CylinderGeometry(1.07, 1.07, 0.30, 28, 1, true),
      new THREE.MeshStandardMaterial({ color:0x5a4a3a, roughness:0.5, metalness:0.6, side:THREE.DoubleSide }));
    band.position.y = 0.42; band.castShadow = true;
    bodyG.add(band);
  }
  spinG.add(bodyG);

  // 軸（つまようじ）: 先端から本体を貫いて上へ
  const above = 0.30 * axis.len;
  const shaftLen = below + bodyH + above;
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(axis.r, axis.r * 0.8, shaftLen, 10),
    new THREE.MeshStandardMaterial({ color:COL.shaft, roughness:0.8 }));
  shaft.position.y = shaftLen / 2;
  shaft.castShadow = true;
  spinG.add(shaft);

  root.userData.spinG = spinG;
  return root;
}

function disposeTop(root){
  root.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  });
}

/* ================= レンダラーとシーン ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0xf7ead2, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

function addLights(scene, shadowRange){
  scene.add(new THREE.HemisphereLight(0xfff4dd, 0x9a7a4f, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 1.7);
  sun.position.set(5, 10, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -shadowRange; sun.shadow.camera.right = shadowRange;
  sun.shadow.camera.top = shadowRange;   sun.shadow.camera.bottom = -shadowRange;
  sun.shadow.camera.far = 30;
  scene.add(sun);
}

/* --- プレビュー用シーン --- */
const previewScene = new THREE.Scene();
previewScene.background = new THREE.Color(0xf7ead2);
addLights(previewScene, 4);
const previewCam = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
previewCam.position.set(0, 2.1, 5.2);
previewCam.lookAt(0, 1.0, 0);
{
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(3.4, 40),
    new THREE.MeshStandardMaterial({ color:0xe8d3a8, roughness:1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  previewScene.add(ground);
}

/* --- バトル用シーン --- */
const ARENA_R = 6;                       // 土俵の半径
const bowlY = r => 1.2 * (r / ARENA_R) * (r / ARENA_R);  // すり鉢の高さ（中心→縁で1.2）
const LIP_R = 5.9;          // 縁のヘリの位置（中心からの距離）
const LIP_SPEED = 3.2;      // ヘリを越えるのに必要な外向き（径方向）の速度
const battleScene = new THREE.Scene();
battleScene.background = new THREE.Color(0xf7ead2);
addLights(battleScene, 9);
const battleCam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
{
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color:0xefdcb2, roughness:1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.06;
  battleScene.add(ground);

  const bowl = latheFrom([
    [0.001,0.00],[1.0,0.03],[2.0,0.13],[3.0,0.30],[4.0,0.53],[5.0,0.83],[5.5,1.01],[6.0,1.20],[6.35,1.38],[6.6,1.12],
  ], new THREE.MeshStandardMaterial({ color:0xffffff, vertexColors:true, roughness:0.85, side:THREE.DoubleSide }));
  bowl.castShadow = false; bowl.receiveShadow = true;
  // 中心からの距離に応じた色の濃淡（中心は深く、縁にいくほど明るく）で窪みを表現
  {
    const pos = bowl.geometry.attributes.position;
    const cols = new Float32Array(pos.count * 3);
    const cIn = new THREE.Color(0x7c4f24), cMid = new THREE.Color(0xb98a52), cOut = new THREE.Color(0xe3b96e);
    const tmp = new THREE.Color();
    for (let i = 0; i < pos.count; i++){
      const r = Math.hypot(pos.getX(i), pos.getZ(i));
      const tt = Math.min(1, r / ARENA_R);
      if (tt < 0.5) tmp.copy(cIn).lerp(cMid, tt * 2);
      else tmp.copy(cMid).lerp(cOut, (tt - 0.5) * 2);
      cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
    }
    bowl.geometry.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  }
  battleScene.add(bowl);

  // 縁（リム）：太く・濃くして土俵の輪郭と立ち上がりを強調
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(6.35, 0.13, 12, 56),
    new THREE.MeshStandardMaterial({ color:0x6e4520, roughness:0.8 }));
  rim.rotation.x = Math.PI / 2; rim.position.y = 1.38;
  battleScene.add(rim);

  // 縁の内側の低いヘリ（唇状の盛り上がり）。リムより低く・細くして「ちょっとした」段差にする
  const lip = new THREE.Mesh(
    new THREE.TorusGeometry(LIP_R, 0.075, 10, 64),
    new THREE.MeshStandardMaterial({ color:0x8a5a2a, roughness:0.8 }));
  lip.rotation.x = Math.PI / 2; lip.position.y = bowlY(LIP_R) + 0.03;
  battleScene.add(lip);

  // 斜面に沿った同心円ライン（濃淡交互で、窪みの等高線として目で追えるように）
  const ringMats = [
    new THREE.MeshStandardMaterial({ color:0x7d5226, roughness:0.9 }),
    new THREE.MeshStandardMaterial({ color:0xe6c07a, roughness:0.9 }),
  ];
  [1.2, 2.2, 3.2, 4.2, 5.2].forEach((r, i) => {
    const line = new THREE.Mesh(new THREE.TorusGeometry(r, 0.028, 8, 64), ringMats[i % 2]);
    line.rotation.x = Math.PI / 2;
    line.position.y = bowlY(r) + 0.012;
    battleScene.add(line);
  });
}

/* ================= 画面遷移 ================= */
let screen = 'title';   // title | build | battle （結果はバトル画面の上に重ねる）
function showScreen(name){
  screen = name;
  for (const id of ['title', 'build', 'battle']){
    document.getElementById('screen-' + id).classList.toggle('active', id === name);
  }
  if (name !== 'battle'){
    document.getElementById('screen-result').classList.remove('active');
  }
}

/* ================= 組み立て画面 ================= */
const selection = { axis:'normal', body:'maru', option:'none' };
let previewTop = null;

function refreshPreview(){
  if (previewTop){
    previewScene.remove(previewTop);
    disposeTop(previewTop);
  }
  previewTop = buildTopMesh(selection, 'player');
  previewScene.add(previewTop);
  updateStats();
}

function updateStats(){
  const { st } = calcStats(selection);
  const wrap = document.getElementById('stats');
  wrap.innerHTML = '';
  for (const [key, label] of STAT_KEYS){
    // 内部値1〜12を5段階に換算（最低1、満点5）
    const level = Math.max(1, Math.min(5, Math.round(st[key] / 12 * 5)));
    const pips = `<span class="on">${'▶'.repeat(level)}</span>` +
      `<span class="off">${'▷'.repeat(5 - level)}</span>`;
    const row = document.createElement('div');
    row.className = 'stat';
    row.innerHTML = `<span class="slabel">${label}</span><span class="pips">${pips}</span>`;
    wrap.appendChild(row);
  }
}

function buildChips(containerId, defs, key){
  const wrap = document.getElementById(containerId);
  for (const [value, def] of Object.entries(defs)){
    const btn = document.createElement('button');
    btn.className = 'chip' + (selection[key] === value ? ' sel' : '');
    btn.textContent = def.name;
    btn.addEventListener('click', () => {
      selection[key] = value;
      for (const c of wrap.children) c.classList.remove('sel');
      btn.classList.add('sel');
      refreshPreview();
    });
    wrap.appendChild(btn);
  }
}
buildChips('chips-axis', AXES, 'axis');
buildChips('chips-body', BODIES, 'body');
buildChips('chips-option', OPTIONS, 'option');
refreshPreview();

document.getElementById('play-btn').addEventListener('click', () => showScreen('build'));

/* ================= バトル ================= */
const launchBtn  = document.getElementById('launch-btn');
const powerFill  = document.getElementById('power-fill');
const battleMsg  = document.getElementById('battle-msg');
const spinBarP   = document.getElementById('spin-player');
const spinBarC   = document.getElementById('spin-cpu');

let fighters = null;      // { player, cpu }
let cpuBuild = null;
let phase = 'ready';      // ready | fight | done
let charging = false, power = 0;
let fightTime = 0, cpuTimer = -1;

function randomBuild(){
  const pick = obj => {
    const keys = Object.keys(obj);
    return keys[Math.floor(Math.random() * keys.length)];
  };
  return { axis:pick(AXES), body:pick(BODIES), option:pick(OPTIONS) };
}

function makeFighter(sel, side){
  const mesh = buildTopMesh(sel, side);
  mesh.visible = false;
  battleScene.add(mesh);
  return {
    sel, stats: calcStats(sel), mesh,
    x:0, z:0, vx:0, vz:0, spin:100,
    launched:false, out:false, outTime:0,
    phase: Math.random() * Math.PI * 2,
    spinDir: side === 'player' ? -1 : 1,
    orbit: side === 'player' ? 1 : -1,   // 土俵を周回する向き（互いに逆向き）
  };
}

function startBattle(){
  if (fighters){
    for (const f of [fighters.player, fighters.cpu]){
      battleScene.remove(f.mesh);
      disposeTop(f.mesh);
    }
  }
  fighters = { player: makeFighter(selection, 'player'), cpu: makeFighter(cpuBuild, 'cpu') };
  phase = 'ready'; charging = false; power = 0; fightTime = 0; cpuTimer = -1;
  powerFill.style.width = '0%';
  spinBarP.style.width = '100%'; spinBarC.style.width = '100%';
  battleMsg.textContent = '長押しでパワーをためて、はなして発射！';
  launchBtn.disabled = false;
}

function launchFighter(f, fromX, powerVal){
  f.x = fromX; f.z = (Math.random() - 0.5) * 1.2;
  const ang = Math.atan2(-f.z, -f.x) + (Math.random() - 0.5) * 0.24;
  const speed = (5.2 + powerVal * 0.075) / Math.sqrt(f.stats.mass);
  f.vx = Math.cos(ang) * speed;
  f.vz = Math.sin(ang) * speed;
  f.spin = 100; f.launched = true;
  f.mesh.visible = true;
}

function endBattle(win, reason){
  if (phase === 'done') return;
  phase = 'done';
  const reasons = {
    win:  { out:'あいてを はじき出した！', spin:'あいてより 長く回った！', time:'回転のこりで 勝ち！' },
    lose: { out:'土俵の外に 出てしまった', spin:'先に 止まってしまった',   time:'回転のこりで 負け…' },
  };
  document.getElementById('result-title').textContent = win ? '勝ち！' : '負け…';
  document.getElementById('result-reason').textContent = reasons[win ? 'win' : 'lose'][reason];
  setTimeout(() => {
    if (screen === 'battle'){
      document.getElementById('screen-result').classList.add('active');
    }
  }, 700);
}

function stepBattle(dt){
  const P = fighters.player, C = fighters.cpu;
  fightTime += dt;

  if (cpuTimer > 0){
    cpuTimer -= dt;
    if (cpuTimer <= 0) launchFighter(C, 4.6, 45 + Math.random() * 50);
  }

  for (const f of [P, C]){
    if (!f.launched || f.out) continue;
    // スピン減衰（かいてんが高いほど長持ち）
    f.spin -= Math.max(1.4, 7.6 - f.stats.st.spin * 0.55) * dt;
    const d = Math.hypot(f.x, f.z);
    // すり鉢効果：斜面に沿って中心へ引かれる（距離に比例、旧0.85→2.4）
    // 縁（ARENA_R）の外側では斜面が下向きに転じるので、外へ滑り落ちる力に切り替える
    if (d > 0.01){
      const a = d <= ARENA_R ? 2.4 * d : -3.5;
      f.vx -= (f.x / d) * a * dt;
      f.vz -= (f.z / d) * a * dt;
    }
    // 摩擦（旧0.5→0.22に弱めて、滑りが長続きするように）
    const fr = Math.exp(-0.22 * dt);
    f.vx *= fr; f.vz *= fr;
    // スピンが残っている間は静止させない：進行方向を曲げて土俵を周回させる力＋最低速度の維持
    if (f.spin > 3){
      const spd = Math.hypot(f.vx, f.vz);
      if (spd > 0.05){
        // 速度に垂直な向きの力（強さはスピン残量に比例）。プレイヤーとCPUで逆回り
        const px = -f.vz / spd, pz = f.vx / spd;
        const drive = 1.15 * (Math.max(0, f.spin) / 100);
        f.vx += px * f.orbit * drive * dt;
        f.vz += pz * f.orbit * drive * dt;
      }
      if (spd < 0.55){
        // 止まりそうになったら、土俵の接線方向へそっと押し出す
        let tx, tz;
        if (d > 0.3){ tx = (-f.z / d) * f.orbit; tz = (f.x / d) * f.orbit; }
        else { tx = f.orbit; tz = 0; }
        f.vx += tx * 2.4 * dt;
        f.vz += tz * 2.4 * dt;
      }
    }
    // 速度の上限（斜面加速での暴走防止）
    {
      const spd = Math.hypot(f.vx, f.vz);
      if (spd > 13){ f.vx *= 13 / spd; f.vz *= 13 / spd; }
    }
    // フラつき：スピンが弱いほど速度にノイズ（あんていで軽減）
    if (f.spin < 50){
      const wob = (50 - Math.max(0, f.spin)) / 50;
      const amp = wob * Math.max(0.3, 1.6 - f.stats.st.stab * 0.13);
      f.vx += (Math.random() - 0.5) * amp * 7 * dt;
      f.vz += (Math.random() - 0.5) * amp * 7 * dt;
    }
    f.x += f.vx * dt;
    f.z += f.vz * dt;
    // 縁のヘリ：外向きの勢いが弱ければ跳ね返して土俵内に留める。
    // 径方向速度が LIP_SPEED 以上の強い勢いのときだけヘリを越えさせ、
    // その先は従来どおり（縁の外の斜面で滑り落ちてリングアウト）。
    {
      const dLip = Math.hypot(f.x, f.z);
      if (dLip > LIP_R && dLip <= ARENA_R + 0.5){
        const nx = f.x / dLip, nz = f.z / dLip;
        const vr = f.vx * nx + f.vz * nz;   // 外向きの径方向速度
        if (vr < LIP_SPEED){
          f.x = nx * LIP_R; f.z = nz * LIP_R;
          if (vr > 0){
            f.vx -= (1 + 0.55) * vr * nx;   // 反発係数0.55で跳ね返す
            f.vz -= (1 + 0.55) * vr * nz;
            f.spin -= 1.0;                  // ヘリに当たった分だけ少し回転を失う
          }
        }
      }
    }
    if (Math.hypot(f.x, f.z) > ARENA_R + 0.5){
      f.out = true; f.outTime = fightTime;
    }
  }

  // コマ同士の衝突
  if (P.launched && C.launched && !P.out && !C.out){
    const dx = C.x - P.x, dz = C.z - P.z;
    const dist = Math.hypot(dx, dz);
    const minDist = P.stats.radius + C.stats.radius;
    if (dist > 0.0001 && dist < minDist){
      const nx = dx / dist, nz = dz / dist;
      const mP = P.stats.mass * (1 + P.stats.st.stab * 0.04);
      const mC = C.stats.mass * (1 + C.stats.st.stab * 0.04);
      const invP = 1 / mP, invC = 1 / mC, invSum = invP + invC;
      // めり込み解消
      const overlap = minDist - dist;
      P.x -= nx * overlap * (invP / invSum); P.z -= nz * overlap * (invP / invSum);
      C.x += nx * overlap * (invC / invSum); C.z += nz * overlap * (invC / invSum);
      // 接近している時だけインパルスとスピンダメージ
      const rvn = (C.vx - P.vx) * nx + (C.vz - P.vz) * nz;
      if (rvn < 0){
        const jimp = -(1 + 0.9) * rvn / invSum;
        P.vx -= jimp * invP * nx; P.vz -= jimp * invP * nz;
        C.vx += jimp * invC * nx; C.vz += jimp * invC * nz;
        const impact = 0.6 + Math.min(1.4, Math.abs(rvn) * 0.12);
        const dmg = (atkF, defF) => Math.max(0.3,
          (1.0 + Math.max(-2, Math.min(8, atkF.stats.st.atk - defF.stats.st.def)) * 0.55
            + (atkF.stats.spike ? 2.2 : 0)) * impact);
        C.spin -= dmg(P, C);
        P.spin -= dmg(C, P);
      }
    }
  }

  // 勝敗判定
  if (P.out)      return endBattle(false, 'out');
  if (C.out)      return endBattle(true, 'out');
  if (P.spin <= 0 && C.spin <= 0) return endBattle(P.spin >= C.spin, 'spin');
  if (P.spin <= 0) return endBattle(false, 'spin');
  if (C.spin <= 0) return endBattle(true, 'spin');
  if (fightTime > 90) return endBattle(P.spin >= C.spin, 'time');
}

function syncFighters(dt, t){
  if (!fighters) return;
  for (const f of [fighters.player, fighters.cpu]){
    if (!f.launched) continue;
    const d = Math.hypot(f.x, f.z);
    let y = bowlY(Math.min(d, ARENA_R + 0.6));
    if (f.out) y -= (fightTime - f.outTime) * (fightTime - f.outTime) * 2.5;  // 外へ落ちる
    f.mesh.position.set(f.x, y, f.z);
    const spinNow = Math.max(0, f.spin);
    f.mesh.userData.spinG.rotation.y += f.spinDir * (3 + spinNow * 0.45) * dt;
    const tilt = (1 - spinNow / 100) * 0.30;
    f.mesh.rotation.x = Math.cos(t * 6.7 + f.phase) * tilt * 0.5;
    f.mesh.rotation.z = Math.sin(t * 8.0 + f.phase) * tilt * 0.5;
  }
  spinBarP.style.width = Math.max(0, fighters.player.spin) + '%';
  spinBarC.style.width = Math.max(0, fighters.cpu.spin) + '%';
}

/* --- 発射操作（長押し） --- */
launchBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (phase !== 'ready') return;
  charging = true; power = 0;
});
function releaseLaunch(){
  if (!charging) return;
  charging = false;
  if (phase !== 'ready' || !fighters) return;
  launchFighter(fighters.player, -4.6, power);
  phase = 'fight'; fightTime = 0; cpuTimer = 0.5;
  battleMsg.textContent = 'バトル中！';
  launchBtn.disabled = true;
  powerFill.style.width = '0%';
}
window.addEventListener('pointerup', releaseLaunch);
window.addEventListener('pointercancel', releaseLaunch);
launchBtn.addEventListener('contextmenu', e => e.preventDefault());

/* --- バトルまわりのボタン --- */
document.getElementById('battle-btn').addEventListener('click', () => {
  cpuBuild = randomBuild();
  startBattle();
  showScreen('battle');
});
document.getElementById('rematch-btn').addEventListener('click', () => {
  document.getElementById('screen-result').classList.remove('active');
  startBattle();
});
document.getElementById('rebuild-btn').addEventListener('click', () => {
  showScreen('build');
});

/* ================= リサイズとメインループ ================= */
function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  previewCam.aspect = w / h;
  previewCam.updateProjectionMatrix();
  battleCam.aspect = w / h;
  const s = (w / h) < 1 ? 1.32 : 1.0;   // 縦持ちでは少し引く
  battleCam.position.set(0, 11 * s, 8.8 * s);
  battleCam.lookAt(0, 0, 0);
  battleCam.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.033, clock.getDelta());
  const t = clock.elapsedTime;
  // 描画領域（ビューポート）を切り替えるため、まず全画面をクリアしておく
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.clear();
  if (screen === 'battle'){
    if (charging){
      power = Math.min(100, power + dt * 95);
      powerFill.style.width = power + '%';
    }
    if (phase === 'fight') stepBattle(dt);
    syncFighters(dt, t);
    renderer.render(battleScene, battleCam);
  } else {
    if (previewTop) previewTop.userData.spinG.rotation.y += dt * 1.4;
    if (screen === 'build'){
      // プレビューはパネルより上の領域だけに描く（設定項目と重ねない）
      // カメラを引いて、コマの表示サイズはタイトル画面の約70%にする
      const rect = document.getElementById('build-preview-space').getBoundingClientRect();
      previewCam.aspect = rect.width / Math.max(1, rect.height);
      previewCam.position.set(0, 2.6, 7.54);
      previewCam.lookAt(0, 1.0, 0);
      previewCam.updateProjectionMatrix();
      const vy = window.innerHeight - rect.bottom;
      renderer.setScissorTest(true);
      renderer.setViewport(rect.left, vy, rect.width, rect.height);
      renderer.setScissor(rect.left, vy, rect.width, rect.height);
    } else {
      previewCam.aspect = window.innerWidth / window.innerHeight;
      previewCam.position.set(0, 2.1, 5.2);
      previewCam.lookAt(0, 1.0, 0);
      previewCam.updateProjectionMatrix();
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    }
    renderer.render(previewScene, previewCam);
  }
}
animate();
</script>
